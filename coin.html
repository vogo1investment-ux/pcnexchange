<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Detail</title>
<link rel="stylesheet" href="dashboard.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#000; color:#fff; }
.coin-container { padding:20px; }
button { margin:5px 0; background:#0f0; color:#000; padding:10px 15px; border:none; border-radius:10px; cursor:pointer;}
</style>
</head>
<body>

<header class="top-header">
  <div class="logo-area">
    <div class="logo-box">P</div>
    <div>
      <h1>PCN EXCHANGE</h1>
    </div>
  </div>
</header>

<div class="coin-container">
  <h2 id="coinName">Loading...</h2>
  <p id="coinDescription"></p>
  <p>Price: $<span id="coinPrice">0.00</span></p>
  <p>Market Cap: $<span id="coinMarketCap">N/A</span></p>
  <p>24h Volume: $<span id="coinVolume">N/A</span></p>
  <p>Supply: <span id="coinSupply">N/A</span></p>
  <p>24h Change: <span id="coinChange">0%</span></p>
  
  <h3>Your Coin Balance: <span id="userCoinBalance">0</span></h3>

  <button id="swapBtn">Swap</button>
  <button id="transferBtn">Transfer</button>
  <button id="receiveBtn">Receive</button>
</div>

<script type="module" src="coin.js"></script>
</body>
</html>
