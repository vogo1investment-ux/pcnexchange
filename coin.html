<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Details</title>
<link rel="stylesheet" href="coin.css">
</head>
<body>

<div class="coin-container">
  <button id="backBtn" class="back-btn">&larr; Back to Market</button>

  <div class="coin-header">
    <img id="coinIcon" class="coin-icon-large" src="" alt="Coin Icon">
    <h1 id="coinName" class="coin-name"></h1>
  </div>

  <p id="coinDesc" class="coin-desc"></p>
  <p>Price: $<span id="coinPrice">0</span></p>
  <p>Your Balance: <span id="coinBalance">0.00000001</span></p>

  <div class="coin-actions">
    <button id="sendBtn">Send</button>
    <button id="receiveBtn">Receive</button>
    <button id="buyBtn">Buy</button>
  </div>
</div>

<div id="buyModal" class="modal hidden">
  <div class="modal-content">
    <span id="closeBuyModal" class="close">&times;</span>
    <h2>Buy <span id="buyCoinName"></span></h2>
    <label>Amount:</label>
    <input type="number" step="0.00000001" id="buyAmount" placeholder="Enter amount">
    <label>Password:</label>
    <input type="password" id="buyPassword" placeholder="Enter your password">
    <button id="confirmBuyBtn">Buy</button>
  </div>
</div>

<script type="module" src="coin.js"></script>
</body>
</html>
