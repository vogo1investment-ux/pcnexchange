<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Details</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { background:#000; color:#fff; padding:20px; font-family:sans-serif; }
.coin-card { background:#111; border:1px solid #0f0; border-radius:15px; padding:20px; margin-bottom:20px; }
.coin-name { font-size:1.5rem; font-weight:bold; }
.coin-description { color:#0f0; margin:10px 0; }
.coin-price { font-size:1.2rem; font-weight:bold; }
.coin-metrics { color:#0ff; font-size:0.9rem; margin-top:10px; }
.form-group { margin-bottom:10px; }
button { width:100%; padding:10px; border:none; border-radius:8px; background:#0f0; color:#000; font-weight:bold; cursor:pointer; }
input { width:100%; padding:10px; border-radius:8px; border:1px solid #0f0; background:#000; color:#fff; margin-bottom:10px; }
</style>
</head>
<body>

<div class="coin-card">
  <div class="coin-name" id="coinName">Loading...</div>
  <div class="coin-description" id="coinDescription"></div>
  <div class="coin-price" id="coinPrice"></div>
  <div id="coinMetrics" class="coin-metrics"></div>
  <div id="userBalance" class="coin-metrics">Your Balance: 0</div>
</div>

<div class="coin-card">
  <div class="form-group">
    <input type="number" id="swapAmount" placeholder="Enter amount to swap" />
    <button id="swapBtn">Swap</button>
  </div>
  <div class="form-group">
    <button id="transferBtn">Transfer</button>
  </div>
  <div class="form-group">
    <button id="receiveBtn">Receive</button>
  </div>
</div>

<script type="module" src="coin.js"></script>

</body>
</html>
