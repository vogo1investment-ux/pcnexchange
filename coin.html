<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Details</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="dashboard.css">
<style>
body { background: #000; color: #fff; padding: 20px; }
.coin-header { text-align:center; margin-bottom:20px; }
.coin-header h1 { color:#0f0; font-size:2rem; }
.action-btn { width:100%; padding:15px; font-weight:bold; border-radius:15px; margin-bottom:10px; cursor:pointer; }
.swap { background:#1E90FF; color:#fff; }
</style>
</head>
<body>

<div class="coin-header">
  <h1 id="coinName">Coin Name</h1>
  <p id="coinSymbol">Symbol</p>
  <p id="coinPrice">$0</p>
</div>

<button class="action-btn swap" id="swapBtn">Swap Balance → Coin</button>

<div id="swapForm" class="hidden bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-6">
  <h2 class="text-2xl font-bold mb-4 text-emerald-400">Swap Balance to Coin</h2>
  <input id="swapAmount" type="number" placeholder="Amount from balance" class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4">
  <button id="submitSwap" class="w-full bg-emerald-400 text-black font-bold p-4 rounded-2xl">Swap</button>
</div>

<script type="module">
const urlParams = new URLSearchParams(window.location.search);
const symbol = urlParams.get("symbol");
document.getElementById("coinName").innerText = symbol;
document.getElementById("coinSymbol").innerText = symbol;
document.getElementById("coinPrice").innerText = "$0 (Static)"; // static until swap

const swapBtn = document.getElementById("swapBtn");
const swapForm = document.getElementById("swapForm");
const swapAmount = document.getElementById("swapAmount");
const submitSwap = document.getElementById("submitSwap");

swapBtn.addEventListener("click", () => {
  swapForm.classList.remove("hidden");
});

// On swap, save transaction to Firebase (pending)
submitSwap.addEventListener("click", async () => {
  const amount = Number(swapAmount.value);
  if (!amount || amount <= 0) return alert("Enter a valid amount");

  // Here we write the transaction to Firebase pending (replace with your Firebase code)
  console.log(`Swap ${amount} to ${symbol} → pending in Firebase`);

  alert(`Swap ${amount} to ${symbol} submitted. Pending approval in Firebase.`);
  swapAmount.value = "";
  swapForm.classList.add("hidden");
});
</script>
</body>
</html>
