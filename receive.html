<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receive Wallet</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black text-white">

<div class="p-5 border-b border-zinc-800">
<h1 class="text-2xl text-emerald-500 font-bold">
My Wallet
</h1>
</div>

<div class="p-5 space-y-5">

<!-- EMAIL -->
<div class="bg-zinc-900 p-4 rounded-xl">

<p class="text-gray-400">Email</p>
<h2 id="userEmail" class="text-lg font-bold text-white">
Loading user...
</h2>

</div>

<!-- WALLET ID -->
<div class="bg-zinc-900 p-4 rounded-xl">

<p class="text-gray-400">Wallet ID</p>
<h2 id="walletId" class="text-lg font-bold text-emerald-400">
Loading wallet...
</h2>

<button onclick="copyWallet()"
class="mt-3 bg-emerald-500 text-black px-4 py-2 rounded-lg">

Copy Wallet ID

</button>

</div>

<!-- QR -->
<div class="bg-zinc-900 p-4 rounded-xl text-center">

<p class="text-gray-400 mb-3">QR Code</p>

<canvas id="qrCanvas"></canvas>

</div>

</div>

<script type="module" src="receive.js"></script>

</body>

</html>
