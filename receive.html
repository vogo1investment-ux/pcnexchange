<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receive Wallet</title><link rel="stylesheet" href="dashboard.css"><style>

.container{
max-width:500px;
margin:80px auto;
background:#111;
padding:25px;
border-radius:20px;
text-align:center;
border:1px solid #1f1f1f;
}

.title{
color:#00ff88;
font-weight:900;
font-size:22px;
}

.uid-box{
margin-top:20px;
background:#000;
padding:15px;
border-radius:10px;
border:1px solid #00ff88;
word-break:break-all;
font-weight:900;
min-height:40px;
display:flex;
align-items:center;
justify-content:center;
}

button{
margin-top:15px;
padding:10px 15px;
background:#00ff88;
border:none;
font-weight:900;
cursor:pointer;
}

.status{
color:#888;
margin-top:10px;
font-size:14px;
}

</style></head><body><div class="container"><div class="title">RECEIVE WALLET</div><p class="status">Your UID wallet address</p><!-- 🔥 THIS IS THE IMPORTANT PART --><div id="uidBox" class="uid-box">
Loading UID...
</div><button onclick="copyUID()">Copy UID</button>

</div><!-- YOUR JS WILL TARGET THIS ID --><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let uid = "";

/* 🔥 SAFE AUTH */
onAuthStateChanged(auth, (user) => {

const box = document.getElementById("uidBox");

/* IF NO USER */
if (!user) {
box.innerText = "Not logged in";
return;
}

/* GET UID */
uid = user.uid;

/* SHOW UID IN HTML */
box.innerText = uid;

});

/* COPY BUTTON */
window.copyUID = function () {

if (!uid) return;

navigator.clipboard.writeText(uid);

alert("UID copied!");

};

</script></body>
</html>
