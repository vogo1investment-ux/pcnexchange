<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PCN Wallet</title><link rel="stylesheet" href="dashboard.css"><style>

.wallet-box {
max-width: 600px;
margin: 80px auto;
background: #111;
padding: 25px;
border-radius: 20px;
border: 1px solid #1f1f1f;
text-align: center;
}

.wallet-id {
background: #000;
padding: 15px;
border-radius: 10px;
margin-top: 20px;
word-break: break-all;
border: 1px solid #00ff88;
color: #fff;
font-weight: 900;
}

button {
margin-top: 15px;
padding: 10px 15px;
background: #00ff88;
border: none;
font-weight: 900;
cursor: pointer;
}

.loading {
color: #888;
}

</style></head><body><div class="wallet-box"><h2 style="color:#00ff88;">My Wallet</h2><p>Receive & Send Wallet Address</p><div id="walletArea" class="loading">
Loading wallet...
</div><button onclick="copyWallet()">Copy Wallet ID</button>

</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let walletId = "";

/* 🔥 SAFE AUTH HANDLER (NO AUTO LOGOUT BUG) */
onAuthStateChanged(auth, async (user) => {

if (!user) {
document.getElementById("walletArea").innerHTML =
"<p class='loading'>Please login again</p>";
return;
}

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

let data = snap.exists() ? snap.data() : {};

/* WALLET FIX (IMPORTANT) */
walletId =
data.walletId ||
user.uid ||
user.email;

/* DISPLAY WALLET (NO MORE LOADING BUG) */
document.getElementById("walletArea").innerHTML = `
<div class="wallet-id">
${walletId}
</div>
`;

});

window.copyWallet = function () {

if (!walletId) return;

navigator.clipboard.writeText(walletId);

alert("Wallet ID copied!");

};

</script></body>
</html>
