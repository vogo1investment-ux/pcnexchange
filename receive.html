<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receive - PCN Exchange</title><link rel="stylesheet" href="dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script><style>

.container {
max-width: 500px;
margin: 70px auto;
background: #111;
padding: 25px;
border-radius: 20px;
text-align: center;
border: 1px solid #1f1f1f;
}

.wallet {
background: #000;
padding: 15px;
border-radius: 10px;
margin-top: 20px;
word-break: break-all;
border: 1px solid #00ff88;
font-weight: 900;
}

button {
margin-top: 15px;
padding: 10px 15px;
background: #00ff88;
border: none;
font-weight: 900;
cursor: pointer;
}

#qrcode {
margin-top: 20px;
display: flex;
justify-content: center;
}

</style></head><body><div class="container"><h2 style="color:#00ff88;">Receive Wallet</h2><p>Your wallet address (copy and share)</p><div id="walletBox" class="wallet">
Loading wallet...
</div><button onclick="copyWallet()">Copy Wallet ID</button>

<div id="qrcode"></div></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let walletID = "";

/* SAFE AUTH (NO LOGOUT BUG) */
onAuthStateChanged(auth, (user) => {

if (!user) {
walletID = "NOT LOGGED IN";
document.getElementById("walletBox").innerText = walletID;
return;
}

/* USER ID ALWAYS AVAILABLE */
walletID = user.uid;

/* SHOW WALLET ID */
document.getElementById("walletBox").innerText = walletID;

/* QR CODE */
new QRCode(document.getElementById("qrcode"), {
text: walletID,
width: 180,
height: 180
});

});

window.copyWallet = function () {

navigator.clipboard.writeText(walletID);
alert("Wallet ID copied!");

};

</script></body>
</html>
