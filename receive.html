<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receive Wallet</title><link rel="stylesheet" href="dashboard.css"><style>

.container{
max-width:500px;
margin:80px auto;
background:#111;
padding:25px;
border-radius:20px;
text-align:center;
border:1px solid #1f1f1f;
}

.title{
color:#00ff88;
font-weight:900;
font-size:22px;
}

.box{
margin-top:20px;
background:#000;
padding:15px;
border-radius:10px;
border:1px solid #00ff88;
word-break:break-all;
font-weight:900;
min-height:50px;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

button{
margin-top:15px;
padding:10px 15px;
background:#00ff88;
border:none;
font-weight:900;
cursor:pointer;
}

.status{
color:#888;
margin-top:10px;
font-size:14px;
}

</style></head><body><div class="container"><div class="title">RECEIVE WALLET</div><p class="status">Copy your wallet address (UID or Email)</p><div id="walletBox" class="box">
Loading...
</div><button onclick="copyWallet()">Copy</button>

</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let wallet = "";

/* SAFE AUTH HANDLER */
onAuthStateChanged(auth, (user) => {

const box = document.getElementById("walletBox");

/* IF NO USER */
if (!user) {
box.innerText = "No wallet available";
return;
}

/* 🔥 PRIORITY SYSTEM */
wallet =
user.uid ||
user.email ||
"No wallet found";

/* SHOW RESULT */
box.innerText = wallet;

});

/* COPY */
window.copyWallet = function () {

if (!wallet) return;

navigator.clipboard.writeText(wallet);

alert("Copied!");

};

</script></body>
</html>
