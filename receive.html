<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receive Wallet - PCN Exchange</title><link rel="stylesheet" href="dashboard.css"><script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script><style>
.receive-box{
max-width:500px;
margin:50px auto;
background:#111;
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #1f1f1f;
}

.wallet-id{
background:#000;
padding:15px;
border-radius:10px;
margin:15px 0;
word-break:break-all;
border:1px solid #00ff88;
}

button{
padding:10px 15px;
background:#00ff88;
border:none;
font-weight:900;
cursor:pointer;
margin-top:10px;
}

#qrcode{
margin-top:20px;
display:flex;
justify-content:center;
}
</style></head><body><div class="receive-box"><h2 style="color:#00ff88;">Your Wallet</h2><p>Share this wallet address to receive funds</p><div id="walletId" class="wallet-id">
Loading wallet...
</div><button onclick="copyWallet()">Copy Wallet ID</button>

<div id="qrcode"></div></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let wallet = "";

onAuthStateChanged(auth, async (user) => {

if (!user) {
window.location = "index.html";
return;
}

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (!snap.exists()) return;

const data = snap.data();

/* WALLET ID FIX */
wallet =
data.walletId ||
user.uid ||
user.email;

/* SHOW WALLET */
document.getElementById("walletId").innerText = wallet;

/* QR CODE */
new QRCode(document.getElementById("qrcode"), {
text: wallet,
width: 180,
height: 180
});

});

/* COPY FUNCTION */
window.copyWallet = function () {

navigator.clipboard.writeText(wallet);

alert("Wallet copied!");

};

</script></body>
</html>
