<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receive Wallet</title><link rel="stylesheet" href="dashboard.css"><style>

.container{
max-width:500px;
margin:80px auto;
background:#111;
padding:25px;
border-radius:20px;
text-align:center;
border:1px solid #1f1f1f;
}

.uid-box{
background:#000;
padding:15px;
border-radius:10px;
margin-top:20px;
word-break:break-all;
border:1px solid #00ff88;
font-weight:900;
}

button{
margin-top:15px;
padding:10px 15px;
background:#00ff88;
border:none;
font-weight:900;
cursor:pointer;
}

.loading{
color:#888;
}

</style></head><body><div class="container"><h2 style="color:#00ff88;">Receive Funds</h2><p>Your UID is your wallet address</p><div id="uidBox" class="loading">
Loading UID...
</div><button onclick="copyUID()">Copy UID</button>

</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let uid = "";

/* SAFE AUTH (NO LOGIN TEXT BUG) */
onAuthStateChanged(auth, (user) => {

if (!user) {
return; // ❗ DO NOTHING (NO "NOT LOGGED IN")
}

uid = user.uid;

/* SHOW UID ALWAYS */
document.getElementById("uidBox").innerHTML =
`<div class="uid-box">${uid}</div>`;

});

/* COPY FUNCTION */
window.copyUID = function () {

if (!uid) return;

navigator.clipboard.writeText(uid);

alert("UID copied!");

};

</script></body>
</html>
