<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receive Funds</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body class="bg-black text-white p-5 min-h-screen">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Receive Funds</h1>

<div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-6 text-center">
  <h2 class="text-2xl font-bold text-emerald-400 mb-4">Your Wallet Info</h2>

  <p class="mb-2">Email:</p>
  <input id="userEmail" type="text" readonly class="w-full p-3 rounded-2xl bg-black border border-zinc-700 mb-4 text-center">

  <p class="mb-2">UID:</p>
  <input id="userUid" type="text" readonly class="w-full p-3 rounded-2xl bg-black border border-zinc-700 mb-4 text-center">

  <button id="copyBtn" class="w-full bg-emerald-400 text-black font-bold p-3 rounded-2xl mb-4">Copy Info</button>

  <h2 class="text-xl font-bold text-emerald-400 mb-2">Your QR Code</h2>
  <canvas id="qrcode"></canvas>
</div>

<script type="module" src="receive.js"></script>

</body>
</html>
