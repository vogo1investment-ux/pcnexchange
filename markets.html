<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>
<style>
body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
#marketCoins { display: flex; flex-wrap: wrap; gap: 15px; }
.coin-card { 
  background: #111; 
  border: 1px solid #0f0; 
  border-radius: 12px; 
  padding: 15px; 
  width: 200px; 
  cursor: pointer; 
  color: #fff; 
}
.coin-name { font-weight: bold; font-size: 1.1rem; }
.coin-description { color: #0f0; font-size: 0.85rem; margin-top: 5px; }
.coin-price { font-weight: bold; font-size: 1rem; margin-top:5px;}
</style>
</head>
<body>

<div id="marketCoins"></div>

<script type="module" src="market.js"></script>
</body>
</html>
