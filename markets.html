<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN Exchange Market Test</title>
<link rel="stylesheet" href="dashboard.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#000; color:#fff; }
.market-box { padding:20px; }
.coin-card { background:#111; border:1px solid #0f0; border-radius:15px; padding:15px; margin-bottom:10px; cursor:pointer; }
.coin-name { font-weight:bold; font-size:1.2rem; }
.coin-description { color:#0f0; font-size:0.9rem; margin-top:5px; }
.coin-price { font-weight:bold; font-size:1rem; }
.coin-metrics { color:#0ff; font-size:0.8rem; margin-top:5px; }
</style>
</head>
<body>

<header class="top-header">
  <div class="logo-area">
    <div class="logo-box">P</div>
    <div>
      <h1>PCN EXCHANGE</h1>
      <p>Secure Crypto Trading Platform</p>
    </div>
  </div>
</header>

<div class="main-container">
  <div class="market-box">
    <div class="market-header"><h2>Crypto Market</h2></div>
    <div id="marketCoins"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
  authDomain: "pcnexchange.firebaseapp.com",
  databaseURL: "https://pcnexchange-default-rtdb.firebaseio.com",
  projectId: "pcnexchange",
  storageBucket: "pcnexchange.firebasestorage.app",
  messagingSenderId: "278761036604",
  appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const marketContainer = document.getElementById("marketCoins");
const coinsCol = collection(db, "coins");
const previousPrices = {};

// Listen for real-time coin updates
onSnapshot(coinsCol, snapshot => {
  marketContainer.innerHTML = "";
  
  if(snapshot.empty){
    marketContainer.innerHTML = "<p style='color:#f00;'>No coins found in Firebase. Please push coins first.</p>";
    return;
  }

  snapshot.forEach(doc => {
    const coin = doc.data();

    let priceColor = "#0f0";
    if(previousPrices[coin.symbol] !== undefined){
      if(coin.price > previousPrices[coin.symbol]) priceColor = "#00f";
      else if(coin.price < previousPrices[coin.symbol]) priceColor = "#f00";
    }
    previousPrices[coin.symbol] = coin.price;

    const card = document.createElement("div");
    card.className = "coin-card";
    card.innerHTML = `
      <div class="coin-name">${coin.name} (${coin.symbol})</div>
      <div class="coin-description">${coin.description}</div>
      <div class="coin-price" style="color:${priceColor}">$${coin.price}</div>
      <div class="coin-metrics">
        Market Cap: $${coin.marketCap || "N/A"}<br>
        24h Volume: $${coin.volume24h || "N/A"}<br>
        Supply: ${coin.supply || "N/A"}<br>
        24h Change: ${coin.change24h || "0%"}%
      </div>
    `;
    card.addEventListener("click", () => {
      window.location.href = `coin.html?symbol=${coin.symbol}`;
    });

    marketContainer.appendChild(card);
  });
});
</script>
</body>
</html>
