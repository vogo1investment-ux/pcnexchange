<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { background: #000; color: #fff; }
.market-container { max-width: 1000px; margin: auto; padding: 20px; }
.coin-card { background: #111; border: 1px solid #0f0; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; }
.coin-name { font-weight: bold; }
.coin-price { font-weight: bold; }
.coin-change { font-weight: bold; }
.coin-change.red { color: #ff4444; }
.coin-change.blue { color: #1E90FF; }
</style>
</head>
<body>
<div class="market-container">
<h1 class="text-3xl font-bold text-emerald-400 mb-6">Crypto Market</h1>
<div id="coinsList"></div>
</div>

<script type="module" src="market.js"></script>
</body>
</html>
