<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN Exchange Market</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #000; color: #fff; }
  .market-box { padding: 20px; }
  .coin-card {
    background: #111;
    border: 1px solid #0f0;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
  }
  .coin-description { color: #0f0; font-size: 0.9rem; margin-top: 5px; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="top-header">
  <div class="logo-area">
    <div class="logo-box">P</div>
    <div>
      <h1>PCN EXCHANGE</h1>
      <p>Secure Crypto Trading Platform</p>
    </div>
  </div>
  <div class="header-icons">
    <a href="notifications.html"><i class="fa-solid fa-bell"></i></a>
    <a href="profile.html"><i class="fa-solid fa-user"></i></a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
  </div>
</header>

<!-- MAIN MARKET -->
<div class="main-container">
  <div class="market-box">
    <div class="market-header">
      <h2>Crypto Market</h2>
    </div>
    <!-- Coins will be dynamically inserted here -->
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="markets.html" class="active"><i class="fa-solid fa-chart-simple"></i><span>Markets</span></a>
    <a href="trade.html"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>Trade</span></a>
    <a href="assets.html"><i class="fa-solid fa-coins"></i><span>Assets</span></a>
    <a href="wallet.html"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
  </nav>
</div>

<!-- Include the market.js script -->
<script type="module" src="market.js"></script>

</body>
</html>
