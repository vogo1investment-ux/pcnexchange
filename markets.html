<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Market</title>
<link rel="stylesheet" href="market.css">
</head>
<body>

<h1 class="page-title">Crypto Market</h1>

<div id="marketList">Loading coins...</div>

<!-- Coin Detail Section -->
<div id="coinSection" class="hidden">
  <button id="backBtn" class="back-btn">&larr; Back to Market</button>
  <h2 id="coinName" class="coin-title"></h2>
  <img id="coinIcon" class="coin-icon-large" src="" alt="">
  <p id="coinDesc"></p>
  <p>Price: $<span id="coinPrice"></span></p>
  <p>Balance: <span id="coinBalance">0.00000001</span></p>

  <div class="coin-actions">
    <button id="sendBtn">Send</button>
    <button id="receiveBtn">Receive</button>
  </div>
</div>

<script type="module" src="market.js"></script>
</body>
</html>
