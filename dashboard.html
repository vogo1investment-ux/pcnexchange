<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DASHBOARD</title>

<style>

body{
background:#f3f3f3;
font-family:Arial;
padding:20px;
}

.top{
background:#ff6600;
color:white;
padding:20px;
border-radius:20px;
font-weight:bold;
margin-bottom:20px;
text-align:center;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:15px;
font-weight:bold;
}

.btn{
width:100%;
padding:15px;
background:#ff6600;
color:white;
border:none;
margin-top:10px;
font-weight:bold;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.balance{
font-size:20px;
margin-top:10px;
}

.nav{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.nav div{
background:#fff;
padding:15px;
border-radius:15px;
text-align:center;
cursor:pointer;
font-weight:bold;
}

</style>

</head>

<body>

<div class="top">
WELCOME TO YOUR DASHBOARD
</div>

<div class="card">

<p>AVAILABLE BALANCE</p>
<div class="balance" id="balance">₦0.00</div>

<button class="btn" onclick="location='wallet.html'">
WALLET
</button>

</div>

<div class="nav">

<div onclick="location='markets.html'">
MARKET
</div>

<div onclick="location='trade.html'">
TRADE
</div>

<div onclick="location='history.html'">
HISTORY
</div>

<div onclick="location='settings.html'">
SETTINGS ⚙️
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBp3K3gJtK2XqIm-eVI1osP-Vma3wj1lTs",
authDomain:"jumiastaff-83757.firebaseapp.com",
projectId:"jumiastaff-83757"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location = "index.html";
return;
}

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(snap.exists()){
balance.innerHTML = "₦" + (snap.data().availableBalance || 0);
}

});

</script>

</body>
</html>
