<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DASHBOARD</title>

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="top">

<div class="title">DASHBOARD</div>

</div>

<div class="card">

WELCOME BACK

<div id="username">Loading...</div>

</div>

<div class="card">

BALANCE

<div class="balance">₦<span id="balance">0</span></div>

</div>

<div class="grid">

<div class="btn" onclick="location='wallet.html'">WALLET</div>

<div class="btn" onclick="location='markets.html'">MARKET</div>

<div class="btn" onclick="location='trade.html'">TRADE</div>

<div class="btn" onclick="location='settings.html'">SETTINGS</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBp3K3gJtK2XqIm-eVI1osP-Vma3wj1lTs",
authDomain:"jumiastaff-83757.firebaseapp.com",
projectId:"jumiastaff-83757"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(!user){
location="index.html";
return;
}

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(snap.exists()){
username.innerHTML = snap.data().username || "User";
balance.innerHTML = snap.data().availableBalance || 0;
}

});

</script>

</body>
</html>
