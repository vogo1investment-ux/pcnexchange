</head><body><!-- HEADER --><header class="top-header"><div class="logo-area">

<!-- 💱 BOLD CURRENCY SECTION --><div style="margin-top:25px; padding:15px; border:2px solid #00ff88; border-radius:15px;"><h3 style="font-weight:900; font-size:18px; color:#00ff88;">

</h3><select id="currencySelect" style="width:100%; padding:10px; margin-top:10px; font-weight:900; background:#111; color:white; border:1px solid #00ff88;">
<option value="USD">USD ($)</option>
<option value="NGN">NGN (₦)</option>

</select></div></div><!-- USER --><div class="user-box"><h3 id="welcomeUser">Loading user...</h3></div><!-- ACTION BUTTONS --><div class="action-grid"><a href="wallet.html" class="action-card">
<i class="fa-solid fa-wallet"></i>

</a><a href="receive.html" class="action-card">
<i class="fa-solid fa-qrcode"></i>

</a><a href="history.html" class="action-card">

<a href="history.html">History</a>

</nav><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

// FIREBASE
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// STABLE LOGIN
setPersistence(auth, browserLocalPersistence);

let balance = 0;
let hidden = false;

// TOGGLE BALANCE
window.toggleBalance = function () {

const el = document.getElementById("balance");

if (!hidden) {
el.innerText = "******";
} else {
el.innerText = "$" + balance;
}

hidden = !hidden;

};

// AUTH
onAuthStateChanged(auth, async (user) => {

if (!user) return;

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (snap.exists()) {

const data = snap.data();

balance = data.availableBalance || 0;

document.getElementById("welcomeUser").innerText =
data.username || "PCN USER";

document.getElementById("balance").innerText =
"$" + balance;

}

});

</script></body>
</html>
