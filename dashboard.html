<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig={

apiKey:"AIzaSyBp3K3gJtK2XqIm-eVI1osP-Vma3wj1lTs",

authDomain:"jumiastaff-83757.firebaseapp.com",

projectId:"jumiastaff-83757",

storageBucket:"jumiastaff-83757.firebasestorage.app",

messagingSenderId:"1018307795636",

appId:"1:1018307795636:web:6545b94e234fe9fb1ad5e1"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location="login.html";

return;

}

const ref=
doc(db,"users",user.uid);

const snap=
await getDoc(ref);

if(snap.exists()){

const data=snap.data();

document.getElementById(
"welcomeUser"
).innerText=
data.username || "PCN USER";

document.getElementById(
"balance"
).innerText=
"$"+(data.availableBalance || 0);

}

}

);

const coins=[

{

name:"Bitcoin",

symbol:"BTC",

price:"67,245",

change:"+2.5%"

},

{

name:"Ethereum",

symbol:"ETH",

price:"3,521",

change:"+1.2%"

},

{

name:"Solana",

symbol:"SOL",

price:"149",

change:"-0.8%"

}

];

const market=
document.getElementById(
"marketList"
);

coins.forEach(

coin=>{

market.innerHTML += `

<div class="market-item">

<div>

<h3>

${coin.symbol}

</h3>

<p>

${coin.name}

</p>

</div>

<div class="market-right">

<h4>

$${coin.price}

</h4>

<span class="${
coin.change.includes('+')
?
'green'
:
'red'
}">

${coin.change}

</span>

</div>

</div>

`;

}

);

</script>

</body>

</html>
