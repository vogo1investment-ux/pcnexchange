<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyBp3K3gJtK2XqIm-eVI1osP-Vma3wj1lTs",

authDomain:
"jumiastaff-83757.firebaseapp.com",

projectId:
"jumiastaff-83757",

storageBucket:
"jumiastaff-83757.firebasestorage.app",

messagingSenderId:
"1018307795636",

appId:
"1:1018307795636:web:6545b94e234fe9fb1ad5e1",

measurementId:
"G-W9M358ZS1G"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

/* USER */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location =
"index.html";

return;

}

const userRef =
doc(
db,
"users",
user.uid
);

const snap =
await getDoc(
userRef
);

if(snap.exists()){

const data =
snap.data();

document.getElementById(
"welcomeUser"
).innerText =
data.username || "PCN USER";

document.getElementById(
"balance"
).innerText =
"$" + (data.availableBalance || 0);

}

}

);

/* LIVE MARKET */

const coins=[

{

name:"BTC",

price:"67,245",

change:"+2.5%"

},

{

name:"ETH",

price:"3,521",

change:"+1.2%"

},

{

name:"SOL",

price:"149",

change:"-0.8%"

}

];

const market =
document.getElementById(
"marketList"
);

coins.forEach(

coin=>{

market.innerHTML += `

<div class="market-item">

<div>

<h3>

${coin.name}

</h3>

<p>

$${coin.price}

</p>

</div>

<span class="${
coin.change.includes('+')
?
'green'
:
'red'
}">

${coin.change}

</span>

</div>

`;

}

);

</script>

</body>
