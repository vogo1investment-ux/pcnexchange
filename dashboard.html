<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN EXCHANGE DASHBOARD</title><link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head><body><header class="top-header">
<div class="logo-area">
<div class="logo-box">P</div>
<div>
<h1>PCN EXCHANGE</h1>
<p>Secure Crypto Trading</p>
</div>
</div>
</header><div class="main-container"><!-- BALANCE --><div class="balance-card"><p class="balance-title">TOTAL BALANCE</p><h2 id="balance">$0.00</h2><button onclick="toggleBalance()" class="balance-toggle">
Hide / Show
</button></div><!-- USER --><div class="user-box">
<h3 id="welcomeUser">Loading...</h3>
</div><!-- BUTTON GRID --><div class="action-grid"><a href="wallet.html" class="action-card">
<i class="fa-solid fa-wallet"></i>
<span>Wallet</span>
</a><a href="trade.html" class="action-card">
<i class="fa-solid fa-arrow-right-arrow-left"></i>
<span>Trade</span>
</a><a href="transfer.html" class="action-card">
<i class="fa-solid fa-money-bill-transfer"></i>
<span>Transfer</span>
</a><a href="receive.html" class="action-card">
<i class="fa-solid fa-qrcode"></i>
<span>Receive</span>
</a><a href="history.html" class="action-card">
<i class="fa-solid fa-clock-rotate-left"></i>
<span>History</span>
</a><a href="support.html" class="action-card">
<i class="fa-solid fa-headset"></i>
<span>Support</span>
</a></div></div><!-- BOTTOM NAV --><nav class="bottom-nav">
<a href="dashboard.html" class="active">Home</a>
<a href="wallet.html">Wallet</a>
<a href="trade.html">Trade</a>
<a href="history.html">History</a>
</nav><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

// 🔥 FIREBASE CONFIG (PUT YOUR REAL ONE)
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// 🔥 FORCE STABLE LOGIN (CRITICAL FIX)
setPersistence(auth, browserLocalPersistence);

// STATE
let balance = 0;
let hidden = false;

// TOGGLE BALANCE
window.toggleBalance = function () {

const el = document.getElementById("balance");

if (!hidden) {
el.innerText = "******";
} else {
el.innerText = "$" + balance;
}

hidden = !hidden;

};

// 🔥 SINGLE SAFE AUTH (NO LOGOUT LOOP)
onAuthStateChanged(auth, async (user) => {

if (!user) {
console.log("Waiting for auth...");
return; // NO FORCE REDIRECT
}

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (snap.exists()) {

const data = snap.data();

balance = data.availableBalance || 0;

document.getElementById("welcomeUser").innerText =
data.username || "PCN USER";

document.getElementById("balance").innerText =
"$" + balance;

}

});

</script></body>
</html>
