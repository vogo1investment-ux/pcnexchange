<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

PCN Dashboard

</title>

<link rel="stylesheet"
href="dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- TOP HEADER -->

<header class="topbar">

<div class="logo">

PCN EXCHANGE

</div>

<div class="top-icons">

<i class="fa-solid fa-bell"></i>

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

</a>

</div>

</header>

<!-- MAIN -->

<div class="container">

<!-- PROFILE CARD -->

<div class="profile-card">

<div class="profile-top">

<div>

<p class="small">

WELCOME BACK

</p>

<h2 id="username">

Loading...

</h2>

</div>

<div class="online">

ONLINE

</div>

</div>

<div class="balance-box">

<p>

TOTAL BALANCE

</p>

<h1 id="balance">

$0.00

</h1>

</div>

<div class="wallet-buttons">

<button onclick="location='deposit.html'">

Deposit

</button>

<button onclick="location='wallet.html'">

Withdraw

</button>

</div>

</div>

<!-- QUICK ACTIONS -->

<div class="actions-grid">

<div class="action-card"
onclick="location='trade.html'">

<i class="fa-solid fa-arrow-right-arrow-left"></i>

<p>

Trade

</p>

</div>

<div class="action-card"
onclick="location='markets.html'">

<i class="fa-solid fa-chart-line"></i>

<p>

Markets

</p>

</div>

<div class="action-card"
onclick="location='wallet.html'">

<i class="fa-solid fa-wallet"></i>

<p>

Wallet

</p>

</div>

<div class="action-card"
onclick="location='support.html'">

<i class="fa-solid fa-headset"></i>

<p>

Support

</p>

</div>

</div>

<!-- LIVE MARKET -->

<div class="market-box">

<div class="market-top">

<h3>

Live Market

</h3>

<a href="markets.html">

See All

</a>

</div>

<div id="marketList">

</div>

</div>

<!-- REFERRAL -->

<div class="referral-box">

<div>

<h3>

Referral Bonus

</h3>

<p>

Invite friends and earn rewards

</p>

</div>

<button>

Invite

</button>

</div>

</div>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<a href="dashboard.html"
class="active">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</a>

<a href="markets.html">

<i class="fa-solid fa-chart-line"></i>

<span>

Markets

</span>

</a>

<a href="trade.html">

<i class="fa-solid fa-arrow-right-arrow-left"></i>

<span>

Trade

</span>

</a>

<a href="wallet.html">

<i class="fa-solid fa-wallet"></i>

<span>

Wallet

</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</a>

</nav>

<script type="module"
src="main.js">

</script>

<script>

const coins=[

{

name:"BTC",

price:"67,245",

change:"+2.5%"

},

{

name:"ETH",

price:"3,521",

change:"+1.2%"

},

{

name:"SOL",

price:"149",

change:"-0.8%"

}

];

const marketList=

document.getElementById(
"marketList"
);

coins.forEach(

coin=>{

marketList.innerHTML+=`

<div class="coin">

<div>

<h4>

${coin.name}

</h4>

<p>

$${coin.price}

</p>

</div>

<span class="${
coin.change.includes('+')
?
'green'
:
'red'
}">

${coin.change}

</span>

</div>

`;

}

);

</script>

</body>

</html>
