<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>

</title>

<link rel="stylesheet"
href="dashboard.css">

</head>

<body>

<div class="topbar">

<div class="logo">

PCN EXCHANGE

</div>

<div class="userBox">

<span id="username">

Loading...

</span>

</div>

</div>

<div class="welcome">

<h1>

Welcome Back

</h1>

<p>

Manage your crypto assets and trading activities.

</p>

</div>

<div class="balanceCard">

<div class="small">

Total Balance

</div>

<div class="big">

$

<span id="balance">

0

</span>

</div>

<div class="profit">

+2.45%

</div>

</div>

<div class="cards">

<div class="miniCard">

<h2>

Deposit

</h2>

<p>

Add funds

</p>

</div>

<div class="miniCard">

<h2>

Withdraw

</h2>

<p>

Cash out

</p>

</div>

<div class="miniCard">

<h2>

Trade

</h2>

<p>

Start trading

</p>

</div>

<div class="miniCard">

</h2>

<p>

<div class="navigation">

<button onclick="location='dashboard.html'">

Dashboard

</button>

<button onclick="location='markets.html'">

Markets

</button>

<button onclick="location='wallet.html'">

Wallet

</button>

<button onclick="location='profile.html'">

</button>

</div>

<script type="module">

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {

getFirestore,

doc,

getDoc

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyBp3K3gJtK2XqIm-eVI1osP-Vma3wj1lTs",

authDomain:"jumiastaff-83757.firebaseapp.com",

projectId:"jumiastaff-83757",

storageBucket:"jumiastaff-83757.firebasestorage.app",

messagingSenderId:"1018307795636",

appId:"1:1018307795636:web:6545b94e234fe9fb1ad5e1"

};

const app=

initializeApp(firebaseConfig);

const auth=

getAuth(app);

const db=

getFirestore(app);

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

location="index.html";

return;

}

const ref=

doc(

db,

"users",

user.uid

);

const snap=

await getDoc(ref);

if(snap.exists()){

let d=snap.data();

username.innerHTML=

d.username||"User";

balance.innerHTML=

Number(

d.availableBalance||0

).toLocaleString();

}

}

);

const coins=[

{

name:"BTC",

price:"$105,430",

move:"+2.5%"

},

{

name:"ETH",

price:"$5,420",

move:"+1.2%"

},

{

name:"SOL",

price:"$245",

move:"+5.8%"

},

{

name:"BNB",

price:"$710",

move:"+3.1%"

}

];

coins.forEach(

c=>{

liveCoins.innerHTML+=`

<div class="coin">

<div>

${c.name}

</div>

<div>

${c.price}

</div>

<div class="green">

${c.move}

</div>

</div>

`;

}

);

</script>

</body>

</html>
