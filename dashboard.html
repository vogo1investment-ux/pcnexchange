<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",

authDomain:"pcnexchange.firebaseapp.com",

databaseURL:"https://pcnexchange-default-rtdb.firebaseio.com",

projectId:"pcnexchange",

storageBucket:"pcnexchange.firebasestorage.app",

messagingSenderId:"278761036604",

appId:"1:278761036604:web:a02e2d2ac7a9379d6f9c39"

};

const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);

/* LOAD USER */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location="index.html";

return;

}

try{

const ref=
doc(db,"users",user.uid);

const snap=
await getDoc(ref);

if(snap.exists()){

const data=snap.data();

/* USERNAME */

document.getElementById(
"welcomeUser"
).innerText=
data.username || "PCN USER";

/* BALANCE */

document.getElementById(
"balance"
).innerText=
"$"+(data.availableBalance || 0);

}

}catch(err){

console.log(err);

}

}

);

/* MARKET */

const coins=[

{
name:"Bitcoin",
symbol:"BTC",
price:"67,245",
change:"+2.5%"
},

{
name:"Ethereum",
symbol:"ETH",
price:"3,521",
change:"+1.2%"
},

{
name:"Solana",
symbol:"SOL",
price:"149",
change:"-0.8%"
}

];

const market=
document.getElementById(
"marketList"
);

coins.forEach(

coin=>{

market.innerHTML += `

<div class="market-item">

<div>

<h3>

${coin.symbol}

</h3>

<p>

${coin.name}

</p>

</div>

<div class="market-right">

<h4>

$${coin.price}

</h4>

<span class="${
coin.change.includes('+')
?
'green'
:
'red'
}">

${coin.change}

</span>

</div>

</div>

`;

}

);

</script>

</body>

</html>
