<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade</title>
<link rel="stylesheet" href="trade.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="trade-container">
  <h1>Trade</h1>

  <!-- User Balance & Coin Select -->
  <div class="trade-top">
    <label for="coinSelect">Select Coin:</label>
    <select id="coinSelect"></select>
    <p>Available Balance: <span id="coinBalance">0.00000000</span></p>
  </div>

  <!-- Candlestick chart -->
  <canvas id="tradeChart" height="300"></canvas>

  <!-- Trade Inputs -->
  <div class="trade-inputs">
    <label>Amount to Trade:</label>
    <input type="number" step="0.00000001" id="tradeAmount" value="0.00000000">
    
    <label>Trade Duration:</label>
    <select id="tradeDuration">
      <option value="1d">1 Day</option>
      <option value="3d">3 Days</option>
      <option value="1w">1 Week</option>
      <option value="1m">1 Month</option>
    </select>

    <button id="buyBtn" class="buy">BUY</button>
    <button id="sellBtn" class="sell">SELL</button>
  </div>

  <!-- Trade History -->
  <h2>Trade History</h2>
  <div id="tradeHistory">Loading...</div>
</div>

<script type="module" src="trade.js"></script>
</body>
</html>
