<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Support</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Support Center</h1>

<!-- Send new message -->
<div class="mb-6 bg-zinc-900 p-4 rounded-xl">
  <input id="subjectInput" type="text" placeholder="Subject / Title"
    class="w-full p-3 rounded-xl bg-black border border-zinc-700 mb-2">
  <textarea id="messageInput" placeholder="Write your message here..."
    class="w-full p-3 rounded-xl bg-black border border-zinc-700 mb-2"></textarea>
  <button id="sendBtn" class="w-full bg-emerald-400 text-black font-bold p-3 rounded-xl">
    Send Message
  </button>
</div>

<h2 class="text-2xl font-bold text-emerald-400 mb-3">Your Messages</h2>
<div id="messagesContainer" class="bg-zinc-900 p-4 rounded-xl max-h-[400px] overflow-y-auto">
  <p class="text-center text-zinc-400">Loading your messages...</p>
</div>

<script type="module" src="support.js"></script>
</body>
</html>
