<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Support Center</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Support Center</h1>

<!-- Send New Message -->
<div class="mb-6 bg-zinc-900 p-4 rounded-xl border border-zinc-700">
  <h2 class="text-xl font-bold mb-2">Send New Message</h2>
  <input id="messageTitleInput" type="text" placeholder="Title / Subject"
         class="w-full p-3 rounded-xl bg-black border border-zinc-700 mb-2" />
  <textarea id="messageContentInput" placeholder="Type your message"
            class="w-full p-3 rounded-xl bg-black border border-zinc-700 mb-2"></textarea>
  <button id="sendMessageBtn" class="bg-emerald-400 text-black font-bold p-3 rounded-xl w-full">
    Send Message
  </button>
</div>

<!-- Messages Display -->
<h2 class="text-2xl font-bold text-emerald-400 mb-3">Your Messages</h2>
<div id="messagesContainer" class="space-y-4">
  <p class="text-zinc-400">Loading your messages...</p>
</div>

<script type="module" src="support.js"></script>
</body>
</html>
