<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Support</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Support Center</h1>

<!-- Send Message Form -->
<div class="mb-6">
  <input id="messageTitle" type="text" placeholder="Message Title"
  class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2">
  <textarea id="messageBody" rows="4" placeholder="Write your message here..."
  class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2"></textarea>
  <button id="sendMessageBtn" class="w-full bg-emerald-400 text-black font-bold p-3 rounded-xl">
    Send Message
  </button>
</div>

<!-- Messages Display -->
<div>
  <h2 class="text-xl font-bold text-emerald-400 mb-2">Your Messages</h2>
  <div id="messagesContainer" class="p-4 bg-zinc-800 rounded-xl max-h-96 overflow-y-auto">
    <p class="text-center text-zinc-400">Loading messages...</p>
  </div>
</div>

<script type="module" src="support.js"></script>
</body>
</html>
