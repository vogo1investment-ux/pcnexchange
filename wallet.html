<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>
<style>
body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
.wallet-section { margin-bottom:20px; }
.wallet-section h2 { color:#0f0; }
.button { background:#0f0; color:#000; padding:10px 15px; border:none; border-radius:8px; cursor:pointer; margin-right:5px; }
.coin-balance { background:#111; padding:10px; border-radius:8px; margin-bottom:5px; }
.transaction-card { background:#111; padding:10px; border-radius:8px; margin-bottom:5px; }
</style>
</head>
<body>

<h1>My Wallet</h1>

<div class="wallet-section">
  <h2>Total Balance: $<span id="totalBalance">0.00</span></h2>
</div>

<div class="wallet-section">
  <h2>Referral Code</h2>
  <div>
    <span id="referralCode">Generating...</span>
    <button class="button" id="copyReferralBtn">Copy</button>
  </div>
</div>

<div class="wallet-section">
  <h2>Coin Balances</h2>
  <div id="coinBalances"></div>
</div>

<div class="wallet-section">
  <h2>Quick Actions</h2>
  <button class="button" id="depositBtn">Deposit</button>
  <button class="button" id="withdrawBtn">Withdraw</button>
  <button class="button" id="sendBtn">Send</button>
  <button class="button" id="receiveBtn">Receive</button>
  <button class="button" id="swapBtn">Swap</button>
</div>

<div class="wallet-section">
  <h2>Transaction History</h2>
  <div id="transactionHistory"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
  authDomain: "pcnexchange.firebaseapp.com",
  databaseURL: "https://pcnexchange-default-rtdb.firebaseio.com",
  projectId: "pcnexchange",
  storageBucket: "pcnexchange.firebasestorage.app",
  messagingSenderId: "278761036604",
  appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;

const totalBalanceEl = document.getElementById("totalBalance");
const referralCodeEl = document.getElementById("referralCode");
const coinBalancesEl = document.getElementById("coinBalances");
const transactionHistoryEl = document.getElementById("transactionHistory");
const copyReferralBtn = document.getElementById("copyReferralBtn");

onAuthStateChanged(auth, async user => {
  if(!user) {
    alert("Please login first!");
    window.location.href = "index.html";
    return;
  }
  currentUser = user;

  // Generate referral code as WebsiteName-UID
  referralCodeEl.innerText = `PCN-${currentUser.uid}`;

  copyReferralBtn.addEventListener("click", ()=>{
    navigator.clipboard.writeText(referralCodeEl.innerText);
    alert("Referral code copied!");
  });

  // Load coin balances
  const coinsCol = collection(db, "users", currentUser.uid, "coins");
  onSnapshot(coinsCol, snap => {
    coinBalancesEl.innerHTML = "";
    let total = 0;
    snap.forEach(docSnap => {
      const coin = docSnap.data();
      const card = document.createElement("div");
      card.className = "coin-balance";
      card.innerHTML = `${coin.symbol || "COIN"}: ${coin.balance || 0}`;
      coinBalancesEl.appendChild(card);
      if(coin.balance && coin.price) total += coin.balance * coin.price;
    });
    totalBalanceEl.innerText = total.toFixed(2);
  });

  // Load transaction history
  const txCol = collection(db, "users", currentUser.uid, "transactions");
  onSnapshot(txCol, snap => {
    transactionHistoryEl.innerHTML = "";
    snap.forEach(docSnap => {
      const tx = docSnap.data();
      const card = document.createElement("div");
      card.className = "transaction-card";
      card.innerHTML = `${tx.date || ""} | ${tx.type || ""} | ${tx.coin || ""} | ${tx.amount || 0} | ${tx.status || ""}`;
      transactionHistoryEl.appendChild(card);
    });
  });
});
</script>
</body>
</html>
