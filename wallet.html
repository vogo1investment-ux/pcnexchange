<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet</title>
<link rel="stylesheet" href="wallet.css">
</head>
<body>

<div class="wallet-container">
  <h1>My Wallet</h1>

  <div class="balance-section">
    <p>Available Balance: <span id="availableBalance" class="bold">0.00</span> USD</p>
    <p>Referral Code: <span id="referralCode" class="bold">Loading...</span></p>
    <p>Users Referred: <span id="referredCount" class="bold">0</span></p>
    <p>Referral Commission: <span id="referralCommission" class="bold">0.00</span> USD</p>
  </div>

  <h2>My Crypto Assets</h2>
  <div id="cryptoList">
    <p>Loading coins...</p>
  </div>
</div>

<script type="module" src="wallet.js"></script>
</body>
</html>
