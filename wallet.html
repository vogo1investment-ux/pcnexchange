<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wallet - PCN Exchange</title><link rel="stylesheet" href="dashboard.css"><style>

.wallet-container{
max-width:600px;
margin:60px auto;
background:#111;
padding:25px;
border-radius:20px;
border:1px solid #1f1f1f;
text-align:center;
}

.wallet-box{
background:#000;
padding:15px;
border-radius:10px;
margin-top:20px;
word-break:break-all;
border:1px solid #00ff88;
}

button{
margin-top:15px;
padding:10px 15px;
background:#00ff88;
border:none;
font-weight:900;
cursor:pointer;
}

.loading{
color:#888;
}

</style></head><body><div class="wallet-container"><h2 style="color:#00ff88;">My Wallet</h2><p>Secure wallet dashboard</p><div id="walletData" class="loading">
Loading wallet...
</div><button onclick="copyWallet()">Copy Wallet</button>

</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let walletId = "";

/* FIX: SAFE AUTH HANDLING (NO AUTO LOGOUT BUG) */
onAuthStateChanged(auth, async (user) => {

if (!user) return; // ❗ IMPORTANT FIX (NO REDIRECT)

const ref = doc(db, "users", user.uid);
const snap = await getDoc(ref);

if (!snap.exists()) return;

const data = snap.data();

/* WALLET ID */
walletId =
data.walletId ||
user.uid ||
user.email;

/* DISPLAY */
document.getElementById("walletData").innerHTML = `
<div class="wallet-box">
${walletId}
</div>
`;

});

window.copyWallet = function () {

if (!walletId) return;

navigator.clipboard.writeText(walletId);

alert("Wallet copied!");

};

</script></body>
</html>
