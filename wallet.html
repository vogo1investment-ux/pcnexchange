<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wallet - PCN Exchange</title><link rel="stylesheet" href="dashboard.css"><style>

.wallet-container{
max-width:650px;
margin:60px auto;
background:#111;
padding:25px;
border-radius:20px;
border:1px solid #1f1f1f;
}

.section{
background:#000;
padding:15px;
border-radius:12px;
margin-top:15px;
border:1px solid #1f1f1f;
}

.label{
color:#00ff88;
font-weight:900;
margin-bottom:8px;
display:block;
}

.value{
word-break:break-all;
font-weight:900;
color:white;
}

button{
margin-top:10px;
padding:10px 15px;
background:#00ff88;
border:none;
font-weight:900;
cursor:pointer;
}

.history-box{
max-height:200px;
overflow:auto;
}

.item{
padding:10px;
border-bottom:1px solid #222;
font-size:14px;
}

.green{color:#00ff88;}
.red{color:red;}

</style></head><body><div class="wallet-container"><h2 style="color:#00ff88;">My Wallet</h2><!-- WALLET ID --><div class="section"><span class="label">Wallet ID</span>

<div id="walletId" class="value">Loading...</div><button onclick="copyWallet()">Copy Wallet ID</button>

</div><!-- BALANCE --><div class="section"><span class="label">Balance</span>

<div id="balance" class="value">$0.00</div></div><!-- REFERRAL --><div class="section"><span class="label">Referral Code</span>

<div id="referral" class="value">Loading...</div><button onclick="copyReferral()">Copy Referral</button>

</div><!-- RECEIVED HISTORY --><div class="section"><span class="label">Recent Transactions</span>

<div id="history" class="history-box">Loading...

</div></div></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
doc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let wallet = "";
let referral = "";

/* SAFE AUTH (NO LOGOUT BUG) */
onAuthStateChanged(auth, (user) => {

if (!user) return; // IMPORTANT FIX

const ref = doc(db, "users", user.uid);

/* REALTIME WALLET DATA */
onSnapshot(ref, (snap) => {

if (!snap.exists()) return;

const data = snap.data();

/* WALLET ID */
wallet = user.uid;

document.getElementById("walletId").innerText = wallet;

/* BALANCE */
document.getElementById("balance").innerText =
"$" + (data.availableBalance || 0);

/* REFERRAL */
referral = data.referralCode || user.uid.slice(0,8);

document.getElementById("referral").innerText = referral;

/* HISTORY (SAFE DISPLAY) */
const history = data.history || [];

document.getElementById("history").innerHTML =
history.length === 0
? "<div class='item'>No transactions yet</div>"
: history.map(h =>
`<div class="item">
${h.type} - ${h.amount}
</div>`
).join("");

});

});

/* COPY WALLET */
window.copyWallet = function () {
navigator.clipboard.writeText(wallet);
alert("Wallet copied!");
};

/* COPY REFERRAL */
window.copyReferral = function () {
navigator.clipboard.writeText(referral);
alert("Referral copied!");
};

</script></body>
</html>
