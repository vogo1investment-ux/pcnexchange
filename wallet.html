<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>
<style>
body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
.wallet-section { margin-bottom:20px; }
.wallet-section h2 { color:#0f0; }
.button { background:#0f0; color:#000; padding:10px 15px; border:none; border-radius:8px; cursor:pointer; margin-right:5px; }
.coin-balance { background:#111; padding:10px; border-radius:8px; margin-bottom:5px; }
.transaction-card { background:#111; padding:10px; border-radius:8px; margin-bottom:5px; }
</style>
</head>
<body>

<h1>My Wallet</h1>

<div class="wallet-section">
  <h2>Total Balance: $<span id="totalBalance">0.00</span></h2>
</div>

<div class="wallet-section">
  <h2>Referral Code</h2>
  <div>
    <span id="referralCode">XXXX1234</span>
    <button class="button" id="copyReferralBtn">Copy</button>
  </div>
  <div>Referral Earnings: $<span id="referralEarnings">0.00</span></div>
</div>

<div class="wallet-section">
  <h2>Coin Balances</h2>
  <div id="coinBalances"></div>
</div>

<div class="wallet-section">
  <h2>Quick Actions</h2>
  <button class="button" id="depositBtn">Deposit</button>
  <button class="button" id="withdrawBtn">Withdraw</button>
  <button class="button" id="sendBtn">Send</button>
  <button class="button" id="receiveBtn">Receive</button>
  <button class="button" id="swapBtn">Swap</button>
</div>

<div class="wallet-section">
  <h2>Transaction History</h2>
  <div id="transactionHistory"></div>
</div>

<script type="module" src="wallet.js"></script>
</body>
</html>
