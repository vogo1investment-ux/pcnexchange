<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Notifications</title>
<style>
body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
.container { max-width:700px; margin:auto; }
h1 { color:#0f0; text-align:center; }
.notification-card { background:#111; border:1px solid #222; border-radius:8px; padding:12px; margin-bottom:8px; }
.notification-card h3 { margin:0 0 4px 0; color:#0f0; }
.notification-card p { margin:0; }
</style>
</head>
<body>
<h1>Platform Notifications</h1>
<div class="container" id="notificationsContainer">Loading notifications...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
  authDomain:"pcnexchange.firebaseapp.com",
  databaseURL:"https://pcnexchange-default-rtdb.firebaseio.com",
  projectId:"pcnexchange",
  storageBucket:"pcnexchange.appspot.com",
  messagingSenderId:"278761036604",
  appId:"1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

signInAnonymously(auth).catch(console.error);

onAuthStateChanged(auth, (user) => {
  if(!user){ alert("Auth failed"); return; }

  const container = document.getElementById("notificationsContainer");
  const q = query(collection(db, "notifications"), orderBy("createdAt", "desc"));

  // Real-time listener
  onSnapshot(q, (snapshot) => {
    container.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const div = document.createElement("div");
      div.className = "notification-card";
      div.innerHTML = `<h3>${data.title || "No Title"}</h3><p>${data.message}</p>`;
      container.appendChild(div);
    });
    if(container.innerHTML === "") container.innerHTML = "<p>No notifications yet</p>";
  });
});
</script>
</body>
</html>
