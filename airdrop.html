<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop User Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050816;
  color:white;
}

.header{
  padding:15px;
  text-align:center;
  background:#0f172a;
  color:#00ff99;
  font-weight:bold;
}

.balanceBox{
  text-align:center;
  padding:20px;
  background:#0f172a;
  margin:10px;
  border-radius:12px;
  border:1px solid #1f2937;
}

.balanceBox h1{
  color:#00ff99;
  font-size:28px;
  margin:0;
}

.container{
  padding:15px;
  display:grid;
  gap:15px;
}

.card{
  background:#0f172a;
  border:1px solid #1f2937;
  padding:15px;
  border-radius:12px;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:8px;
  font-weight:bold;
  cursor:pointer;
}

.green{background:#22c55e;color:black;}
.gray{background:#334155;color:white;}
</style>
</head>

<body>

<div class="header">🚀 Airdrop </div>

<!-- 💰 BIG BALANCE (FIXED) -->
<div class="balanceBox">
  💰 TOTAL BALANCE
  <h1 id="totalBalance">0.000000</h1>
</div>

<div class="container" id="list"></div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
