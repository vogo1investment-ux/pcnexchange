<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN Exchange Airdrops</title>

<link rel="stylesheet" href="airdrop.css">

</head>
<body>

<div class="container">

    <div class="header">
        <h1>PCN AIRDROP CENTER</h1>
    </div>

    <!-- USER BALANCE -->

    <div class="balance-box">

        <div class="balance-title">
            Your Airdrop Balance
        </div>

        <div
            class="balance-value"
            id="airdropBalance">

            0.00000000

        </div>

    </div>

    <!-- SEARCH BUTTON -->

    <button
        id="searchAirdropsBtn"
        class="search-btn">

        SEARCH AIRDROPS

    </button>

    <!-- LOADING -->

    <div
        id="loadingBox"
        class="loading"
        style="display:none;">

        Searching available airdrops...

    </div>

    <!-- AIRDROP LIST -->

    <div
        id="airdropList"
        class="airdrop-list">

    </div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
