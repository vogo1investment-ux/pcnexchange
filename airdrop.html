<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop Mining</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.balanceBox{
  background:#111a2e;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#00ff88;
}

.searchBtn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.card{
  background:#111a2e;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
}

.title{font-weight:bold;font-size:18px;}

.row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-top:6px;
}

.mineBtn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:gold;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <div class="balanceBox">
    💰 BALANCE<br>
    <span id="balance">0.00000000</span>
  </div>

  <button class="searchBtn" onclick="loadAirdrops()">
    🔎 Search Airdrops
  </button>

  <div id="list"></div>

</div>

<script type="module" src="airdrop.js"></script>
</body>
</html>
