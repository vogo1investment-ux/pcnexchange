<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:white;
}

.header {
  padding:15px;
  background:#111827;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#00ff99;
}

.container {
  padding:15px;
  display:grid;
  grid-template-columns: 1fr;
  gap:12px;
}

@media(min-width: 768px){
  .container {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background:#161b22;
  padding:15px;
  border-radius:12px;
  border:1px solid #2a2f3a;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.startBtn { background:#00c853; color:black; }
.withdrawBtn { background:#ffb300; color:black; }

.balanceBox {
  background:#0f172a;
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  color:#00ff99;
  border:1px solid #1f2937;
}
</style>
</head>

<body>

<div class="header">🚀 Airdrop Mining Panel</div>

<div class="container">

  <div class="balanceBox" id="balanceBox">
    Balance: 0.000000
  </div>

  <div id="airdropList"></div>

</div>

<button class="withdrawBtn" onclick="withdraw()">
💰 Withdraw Balance
</button>

<script type="module" src="airdrop.js"></script>
</body>
</html>
