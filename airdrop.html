<!DOCTYPE html>
<html>
<head>
  <title>Airdrop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background:#0b0f19;
      color:white;
      font-family: Arial;
      margin:0;
      padding:20px;
    }

    .balance {
      background:#111827;
      padding:20px;
      border-radius:15px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
      color:#00ff99;
      margin-bottom:20px;
    }

    .btn {
      padding:12px;
      width:100%;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .searchBtn {
      background:#22c55e;
      color:black;
    }

    .card {
      background:#111827;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
    }

    .start {
      background:#3b82f6;
      color:white;
    }

    .stop {
      background:#ef4444;
      color:white;
      margin-top:5px;
    }

    #list {
      margin-top:20px;
    }
  </style>
</head>

<body>

  <div class="balance">
    💰 BALANCE<br>
    <span id="balance">0.000000</span>
  </div>

  <button class="btn searchBtn" id="searchBtn">
    🔍 Search for Airdrop
  </button>

  <div id="list"></div>

  <script type="module" src="airdrop.js"></script>
</body>
</html>
