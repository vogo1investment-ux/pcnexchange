<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop Mining</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* BIG BALANCE */
.balanceBox{
  background:#111a2e;
  padding:25px;
  border-radius:15px;
  text-align:center;
}

.balanceTitle{
  font-size:14px;
  opacity:0.8;
}

.balanceValue{
  font-size:32px;
  font-weight:bold;
  color:#00ff88;
}

/* BUTTON */
.btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.search{
  background:#22c55e;
  color:black;
}

.start{
  background:#facc15;
  color:black;
}

/* CARD */
.card{
  background:#111a2e;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
}

.small{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="container">

  <!-- BALANCE -->
  <div class="balanceBox">
    <div class="balanceTitle">TOTAL AIRDROP BALANCE</div>
    <div class="balanceValue">💰 <span id="balance">0.00000000</span></div>
  </div>

  <!-- SEARCH -->
  <button class="btn search" id="searchBtn">🔎 Search Airdrops</button>

  <!-- LIST -->
  <div id="list"></div>

</div>

<script type="module" src="airdrop.js"></script>
</body>
</html>
