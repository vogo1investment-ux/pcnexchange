<!DOCTYPE html>
<html>
<head>
  <title>Airdrop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      background: #111a2e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      color: #00ff99;
    }

    .btn {
      padding: 12px;
      background: #00ff99;
      border: none;
      width: 100%;
      margin-bottom: 15px;
      font-weight: bold;
      border-radius: 8px;
    }

    .card {
      background: #141c2f;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .small {
      font-size: 12px;
      color: #aaa;
    }

    button.start {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: #ffcc00;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="balance" id="balanceBox">💰 Balance: 0.000000</div>

  <button class="btn" id="loadBtn">🔍 Search Airdrops</button>

  <div id="list"></div>

  <script type="module" src="airdrop.js"></script>

</body>
</html>
