<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop Mining</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 12px;
}

/* BALANCE */
.balanceBox {
  background: #111a2e;
  padding: 20px;
  border-radius: 14px;
  text-align: center;
}

.balanceTitle {
  font-size: 14px;
  color: #aaa;
}

.balanceAmount {
  font-size: 32px;
  font-weight: bold;
  color: #00ff88;
}

/* BUTTONS */
.searchBtn {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  font-weight: bold;
  cursor: pointer;
}

.withdrawBtn {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: gold;
  font-weight: bold;
  cursor: pointer;
}

/* CARD */
.card {
  background: #111a2e;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-top: 6px;
  color: #ccc;
}

.mineBtn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #facc15;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <!-- BALANCE -->
  <div class="balanceBox">
    <div class="balanceTitle">💰 TOTAL BALANCE</div>
    <div class="balanceAmount" id="balance">0.00000000</div>
  </div>

  <!-- ✅ UPDATED WITHDRAW BUTTON ONLY -->
  <button class="withdrawBtn"
  onclick="window.location.href='WithdrawAirdrop.html'">
    💸 Withdraw Airdrop
  </button>

  <!-- SEARCH -->
  <button class="searchBtn" onclick="loadAirdrops()">
    🔎 Search Airdrops
  </button>

  <!-- LIST -->
  <div id="list"></div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
