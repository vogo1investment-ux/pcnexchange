<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Airdrop System</title>
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
      padding:15px;
    }

    .card{
      background:#111a2e;
      padding:15px;
      border-radius:12px;
      margin-bottom:12px;
    }

    .balance{
      font-size:30px;
      font-weight:bold;
      color:#00ff99;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      font-size:16px;
      cursor:pointer;
    }

    .search{
      background:#22c55e;
      color:white;
    }

    .start{
      background:#facc15;
    }

    .title{
      font-size:20px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <div>💰 Balance</div>
    <div id="balance" class="balance">0.00000000</div>
  </div>

  <button class="search" onclick="loadAirdrops()">🔍 Search Airdrops</button>

  <div id="list"></div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
