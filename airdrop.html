<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Airdrop</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.balanceBox{
  background:#111a2e;
  padding:20px;
  border-radius:12px;
  text-align:center;
  font-size:28px;
  color:#00ff88;
  font-weight:bold;
}

.card{
  background:#111a2e;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.green{background:#22c55e;}
.gold{background:gold;}
.blue{background:#3b82f6;}
.red{background:#ef4444;}
</style>
</head>

<body>

<div class="container">

  <div class="balanceBox">
    💰 <span id="balance">0.00000000</span>
  </div>

  <div class="card">
    <button class="blue" onclick="loadAirdrops()">🔍 Search Airdrops</button>
    <button class="gold" onclick="goWithdraw()">💸 Withdraw</button>

    <div id="list"></div>
  </div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
