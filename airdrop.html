<!DOCTYPE html>
<html>
<head>
  <title>Airdrop System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0;
      font-family:Arial;
      background:#0b0f19;
      color:white;
      padding:15px;
    }

    .balance {
      background:#111827;
      padding:20px;
      border-radius:15px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
      color:#00ff99;
    }

    .btn {
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      font-weight:bold;
      cursor:pointer;
    }

    .green { background:#22c55e; }
    .blue { background:#3b82f6; color:white; }

    .card {
      background:#111827;
      padding:15px;
      margin-top:10px;
      border-radius:12px;
    }

    #list {
      margin-top:15px;
    }
  </style>
</head>

<body>

  <div class="balance">
    💰 BALANCE<br>
    <span id="balance">0.000000</span>
  </div>

  <button class="btn green" id="searchBtn">
    🔍 Search Airdrops
  </button>

  <div id="list">Loading...</div>

  <script type="module" src="airdrop.js"></script>
</body>
</html>
