<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

/* BALANCE */
.balanceBox {
  background: linear-gradient(135deg, #0f172a, #111a2e);
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 15px rgba(0,255,136,0.2);
}

.balanceTitle {
  font-size: 14px;
  opacity: 0.7;
}

.balanceValue {
  font-size: 32px;
  font-weight: bold;
  color: #00ff88;
  margin-top: 5px;
}

/* BUTTON */
.searchBtn {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  font-weight: bold;
  cursor: pointer;
  color: black;
}

/* AIRDROP CARD */
.card {
  background: #111a2e;
  padding: 15px;
  margin-top: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 13px;
  opacity: 0.9;
}

.mineBtn {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: gold;
  font-weight: bold;
  cursor: pointer;
}

/* SMALL TEXT */
.small {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

  <!-- BALANCE -->
  <div class="balanceBox">
    <div class="balanceTitle">TOTAL AIRDROP BALANCE</div>
    <div class="balanceValue">
      💰 <span id="balance">0.00000000</span>
    </div>
    <div class="small">Mining starts at 0.00000001 per tick</div>
  </div>

  <!-- SEARCH -->
  <button class="searchBtn" onclick="loadAirdrops()">
    🔎 Search Airdrops
  </button>

  <!-- LIST -->
  <div id="list">
    <p class="small">No airdrops loaded yet...</p>
  </div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
