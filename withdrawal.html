<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Funds</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Withdraw Funds</h1>

<!-- WITHDRAW METHOD -->
<div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-6">
<h2 class="text-2xl font-bold mb-4 text-emerald-400">Withdraw to Bank / Wallet</h2>

<p class="mb-2">Enter Withdrawal Amount</p>
<input id="withdrawAmount" type="number" placeholder="Amount to withdraw"
  class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4">

<p class="mb-2">Recipient Wallet / Bank Details</p>
<input id="recipient" type="text" placeholder="Wallet Address / Bank Account"
  class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4">

<button id="submitWithdraw" class="w-full bg-emerald-400 text-black font-bold p-4 rounded-2xl">
Submit Withdrawal
</button>
</div>

<script type="module" src="withdraw.js"></script>
</body>
</html>
