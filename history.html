<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6 text-center">Transaction History</h1>

<div class="flex gap-2 flex-wrap mb-4">
  <button class="tx-tab bg-green-600 px-4 py-2 rounded" data-type="all">All</button>
  <button class="tx-tab bg-green-600 px-4 py-2 rounded" data-type="deposit">Deposit</button>
  <button class="tx-tab bg-green-600 px-4 py-2 rounded" data-type="withdraw">Withdrawal</button>
  <button class="tx-tab bg-green-600 px-4 py-2 rounded" data-type="stake">Stake</button>
</div>

<div id="txList" class="space-y-4 max-h-[600px] overflow-y-auto"></div>

<script type="module" src="history.js"></script>
</body>
</html>
