<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0f0c;
  color:white;
}

.container {
  padding:15px;
  max-width:1000px;
  margin:auto;
}

h1 {
  color:#20e38a;
  text-align:center;
}

.tabs {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin:15px 0;
}

.tab {
  padding:10px 15px;
  border-radius:10px;
  background:#1a1f1c;
  cursor:pointer;
  font-size:14px;
}

.tab.active {
  background:#20e38a;
  color:black;
  font-weight:bold;
}

.card {
  background:#111814;
  border:1px solid #1f2b24;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.row {
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  font-size:13px;
}

.badge {
  padding:3px 8px;
  border-radius:6px;
  background:#20e38a;
  color:black;
  font-size:12px;
}

.small {
  font-size:11px;
  color:#aaa;
}

</style>
</head>

<body>

<div class="container">
  <h1>Transaction History</h1>

  <div class="tabs">
    <div class="tab active" data-type="all">All</div>
    <div class="tab" data-type="deposit">Deposits</div>
    <div class="tab" data-type="withdraw">Withdrawals</div>
    <div class="tab" data-type="stake">Stakes</div>
    <div class="tab" data-type="transfer">Transfers</div>
    <div class="tab" data-type="received">Received</div>
  </div>

  <div id="historyContainer"></div>
</div>

<script type="module" src="history.js"></script>
</body>
</html>
