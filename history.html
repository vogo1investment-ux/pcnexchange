<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color: #000; color: #0f0; font-family: Arial, sans-serif; }
.tx-container { max-width: 900px; margin: auto; padding: 20px; }
h1 { color: #0f0; text-align: center; margin-bottom: 20px; }
.tx-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
.tx-tab { flex: 1 1 120px; padding: 10px; text-align: center; background: #111; cursor: pointer; border: 1px solid #0f0; border-radius: 5px; font-weight: bold; color: #0f0; }
.tx-tab.active { background: #0f0; color: #000; }
.tx-list { display: flex; flex-direction: column; gap: 15px; }
.tx-card { background: #111; border: 1px solid #0f0; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; flex-wrap: wrap; }
.tx-info p, .tx-info small, .tx-info strong { margin: 2px 0; }
.tx-amount { font-weight: bold; font-size: 1.1em; }
@media (max-width:600px){ .tx-card { flex-direction: column; gap: 8px; } }
</style>
</head>
<body>

<div class="tx-container">
  <h1>Transaction History</h1>

  <div class="tx-tabs">
    <div class="tx-tab active" data-type="all">All</div>
    <div class="tx-tab" data-type="deposit">Deposit</div>
    <div class="tx-tab" data-type="withdraw">Withdrawal</div>
    <div class="tx-tab" data-type="stake">Stake</div>
    <div class="tx-tab" data-type="transfer">Transfer</div>
    <div class="tx-tab" data-type="receive">Received</div>
  </div>

  <div id="txList" class="tx-list"></div>
</div>

<script type="module" src="history.js"></script>
</body>
</html>
