<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History</title>
  <link rel="stylesheet" href="history.css">
  <style>
    body {
      background-color: black;
      color: #00ff00;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .history-section {
      margin-bottom: 40px;
    }

    .history-section h2 {
      margin-bottom: 15px;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .card {
      background-color: #001a00;
      border: 1px solid #00ff00;
      border-radius: 8px;
      padding: 15px;
      flex: 1 1 250px;
      min-width: 250px;
      box-shadow: 0 0 10px #00ff0033;
    }

    .card p {
      margin: 5px 0;
    }

    .field-label {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Transaction History</h1>

  <div class="history-section" id="depositSection">
    <h2>Deposit History</h2>
    <div class="cards-container" id="depositCards"></div>
  </div>

  <div class="history-section" id="withdrawalSection">
    <h2>Withdrawal History</h2>
    <div class="cards-container" id="withdrawalCards"></div>
  </div>

  <div class="history-section" id="sentSection">
    <h2>Sent History</h2>
    <div class="cards-container" id="sentCards"></div>
  </div>

  <div class="history-section" id="receivedSection">
    <h2>Received History</h2>
    <div class="cards-container" id="receivedCards"></div>
  </div>

  <script type="module" src="history.js"></script>
</body>
</html>
