<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
/* History-specific styles */
.history-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.history-tab {
  padding: 10px 20px;
  border-radius: 20px;
  background: #111;
  color: #00ff66;
  cursor: pointer;
  font-weight: bold;
  border: 1px solid #00ff66;
}
.history-tab.active {
  background: #00ff66;
  color: #000;
}
.history-card {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  background: #111;
  border: 1px solid #333;
  border-radius: 15px;
  margin-bottom: 10px;
}
.history-info p, .history-info small, .history-info strong {
  margin: 2px 0;
}
@media (max-width: 600px) {
  .history-card {
    flex-direction: column;
    gap: 8px;
  }
}
</style>
</head>
<body class="bg-black text-white p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Transaction History</h1>

<!-- Tabs -->
<div class="history-tabs">
  <div class="history-tab active" data-type="all">All</div>
  <div class="history-tab" data-type="deposit">Deposit</div>
  <div class="history-tab" data-type="withdraw">Withdrawal</div>
  <div class="history-tab" data-type="transfer">Transfer</div>
  <div class="history-tab" data-type="receive">Receive</div>
</div>

<!-- Transaction list -->
<div id="historyList"></div>

<script type="module" src="history.js"></script>

</body>
</html>
