<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN Exchange History</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
  /* History Page Specific Styles */
  body { background-color: #000; color: #0f0; }
  .history-container { padding: 20px; max-width: 900px; margin: auto; }
  h2 { color: #0f0; margin-bottom: 20px; }
  .history-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .history-tab { flex: 1; padding: 10px; text-align: center; background: #111; cursor: pointer; border: 1px solid #0f0; border-radius: 5px; }
  .history-tab.active { background: #0f0; color: #000; font-weight: bold; }
  .history-list { display: flex; flex-direction: column; gap: 15px; }
  .history-card { background: #111; border: 1px solid #0f0; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
  .history-info { display: flex; flex-direction: column; }
  .history-type { font-weight: bold; color: #0f0; }
  .history-date { font-size: 0.85em; color: #aaa; }
  .history-amount { font-weight: bold; }
  .history-amount.deposit { color: #0f0; }
  .history-amount.withdraw { color: #f00; }
</style>
</head>
<body>

<div class="history-container">
  <h2>Transaction History</h2>

  <!-- TABS -->
  <div class="history-tabs">
    <div class="history-tab active" data-type="all">All</div>
    <div class="history-tab" data-type="deposit">Deposit</div>
    <div class="history-tab" data-type="withdraw">Withdrawal</div>
    <div class="history-tab" data-type="transfer">Transfer</div>
    <div class="history-tab" data-type="received">Received</div>
  </div>

  <!-- HISTORY LIST -->
  <div class="history-list" id="historyList">
    <!-- Cards injected by JS -->
  </div>
</div>

<script type="module" src="history.js"></script>
</body>
</html>
