<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Transaction History</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">My Account History</h1>

<div id="historyContainer" class="bg-zinc-900 p-4 rounded-xl max-h-[600px] overflow-y-auto">
<table class="w-full text-left">
<thead>
<tr>
<th class="px-2 py-1">Date</th>
<th class="px-2 py-1">Type</th>
<th class="px-2 py-1">Coin</th>
<th class="px-2 py-1">Amount</th>
<th class="px-2 py-1">Status</th>
</tr>
</thead>
<tbody id="historyTableBody">
<tr><td colspan="5" class="text-center">Loading...</td></tr>
</tbody>
</table>
</div>

<script type="module" src="history.js"></script>
</body>
</html>
