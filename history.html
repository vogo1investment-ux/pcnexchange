<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body { background: #000; color: #0f0; font-family: Arial; padding: 20px; }
.history-tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 15px; }
.history-tab { padding: 8px 12px; cursor: pointer; border: 1px solid #0f0; border-radius: 4px; }
.history-tab.active { background: #0f0; color: #000; }
.history-card { border: 1px solid #0f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #111; }
</style>
</head>
<body>

<h1>Transaction History</h1>

<div class="history-tabs">
  <div class="history-tab active" data-type="all">All</div>
  <div class="history-tab" data-type="deposit">Deposit</div>
  <div class="history-tab" data-type="withdraw">Withdrawal</div>
  <div class="history-tab" data-type="stake">Stake</div>
  <div class="history-tab" data-type="transfer">Transfer</div>
</div>

<div id="historyList"></div>

<script type="module" src="history.js"></script>
</body>
</html>
