<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="admin-dashboard.css">
</head>
<body class="bg-black text-white min-h-screen">

<header class="p-4 flex justify-between items-center bg-zinc-900">
  <h1 class="text-emerald-400 font-bold text-xl">PCN EXCHANGE ADMIN</h1>
  <button id="logoutBtn" class="bg-red-500 p-2 rounded font-bold">Logout</button>
</header>

<main class="p-4 flex flex-col md:flex-row gap-4">

  <!-- Sidebar -->
  <aside class="md:w-1/4 bg-zinc-900 p-4 rounded-xl flex flex-wrap md:flex-col gap-2">
    <button class="sidebar-btn" data-section="wallet">Wallet</button>
    <button class="sidebar-btn" data-section="trade">Trade</button>
    <button class="sidebar-btn" data-section="markets">Markets</button>
    <button class="sidebar-btn" data-section="transfer">Transfer</button>
    <button class="sidebar-btn" data-section="receive">Receive</button>
    <button class="sidebar-btn" data-section="history">History</button>
    <button class="sidebar-btn" data-section="support">Support</button>
    <button class="sidebar-btn" data-section="airdrop">Airdrop</button>
    <button class="sidebar-btn" data-section="explore">Explore</button>
    <button class="sidebar-btn" data-section="crypto-assets">Crypto Assets</button>
  </aside>

  <!-- Main Section -->
  <section id="section-content" class="flex-1 bg-zinc-800 p-4 rounded-xl">
    <p>Select a section from the sidebar to view details</p>
  </section>

</main>

<script type="module" src="admin-dashboard.js"></script>
</body>
</html>
