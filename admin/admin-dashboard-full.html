<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="admin-dashboard.css">
</head>
<body class="bg-black text-white min-h-screen">

<header class="p-4 flex justify-between items-center bg-zinc-900">
  <h1 class="text-emerald-400 font-bold text-xl">PCN EXCHANGE ADMIN</h1>
  <button id="logoutBtn" class="bg-red-500 p-2 rounded font-bold">Logout</button>
</header>

<main class="p-4">

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
    <div class="bg-emerald-500 p-4 rounded-xl font-bold text-black" id="totalUsersCard">Users: 0</div>
    <div class="bg-emerald-500 p-4 rounded-xl font-bold text-black" id="totalDepositsCard">Deposits: $0</div>
    <div class="bg-emerald-500 p-4 rounded-xl font-bold text-black" id="totalWithdrawalsCard">Withdrawals: $0</div>
    <div class="bg-emerald-500 p-4 rounded-xl font-bold text-black" id="pendingTradesCard">Pending Trades: 0</div>
    <div class="bg-emerald-500 p-4 rounded-xl font-bold text-black" id="pendingKycCard">KYC Pending: 0</div>
  </div>

  <!-- Admin Buttons -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
    <button class="admin-btn" data-section="overview">Overview</button>
    <button class="admin-btn" data-section="notifications">Notifications</button>
    <button class="admin-btn" data-section="users">Users</button>
    <button class="admin-btn" data-section="wallets">Wallets</button>
    <button class="admin-btn" data-section="deposits">Deposits</button>
    <button class="admin-btn" data-section="withdrawals">Withdrawals</button>
    <button class="admin-btn" data-section="trades">Trades</button>
    <button class="admin-btn" data-section="kyc">KYC</button>
    <button class="admin-btn" data-section="crypto-assets">Crypto Assets</button>
    <button class="admin-btn" data-section="support">Support</button>
    <button class="admin-btn" data-section="airdrop">Airdrop</button>
    <button class="admin-btn" data-section="explore">Explore</button>
    <button class="admin-btn" data-section="stake-overview">Stake Overview</button>
    <button class="admin-btn" data-section="wallet-reply.js">Wallet Requests</button>
  </div>

  <!-- Section Content -->
  <section id="section-content" class="p-4 bg-zinc-800 rounded-xl min-h-[400px]">
    <p>Select a button to view content</p>
  </section>

</main>

<script type="module" src="admin-dashboard-full.js"></script>
</body>
</html>
