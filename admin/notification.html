<!-- notification.html -->
<div class="p-4">
  <h2 class="text-emerald-400 font-bold mb-2">Send Notification</h2>
  <input type="text" id="titleInput" placeholder="Notification Title" class="p-2 mb-2 w-full text-black" />
  <textarea id="messageInput" placeholder="Message" class="p-2 mb-2 w-full text-black"></textarea>
  <input type="text" id="userIdInput" placeholder="User ID (leave empty for all)" class="p-2 mb-2 w-full text-black" />
  <input type="file" id="imageInput" class="mb-2" />
  <button id="sendBtn" class="bg-emerald-500 p-2 rounded font-bold">Send Notification</button>
  <div id="notificationStatus" class="mt-2 text-white"></div>
</div>
