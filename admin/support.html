<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Support Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Admin Support Panel</h1>

<!-- All Messages -->
<div id="allMessagesContainer" class="space-y-4 mb-6">
  <p class="text-zinc-400">Loading all user messages...</p>
</div>

<hr class="my-6 border-zinc-700">

<!-- Admin Reply Section -->
<h2 class="text-2xl font-bold text-emerald-400 mb-2">Send Reply</h2>
<input id="replyUserIdInput" type="text" placeholder="Enter User UID"
class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2" />
<textarea id="replyMessageInput" placeholder="Type your reply..."
class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2"></textarea>
<button id="sendReplyBtn" class="bg-emerald-400 text-black font-bold p-3 rounded-xl w-full">Send Reply</button>

<script type="module" src="support.js"></script>
</body>
</html>
