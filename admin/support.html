<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Support Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-6">

<h1 class="text-4xl font-bold text-emerald-400 mb-6 text-center">Admin Support Panel</h1>

<div class="max-w-6xl mx-auto">

  <!-- Existing Messages -->
  <h2 class="text-2xl font-semibold text-emerald-400 mb-4">All User Messages</h2>
  <div id="messagesContainer" class="space-y-4 max-h-[500px] overflow-y-auto p-4 bg-zinc-900 rounded-2xl">
    <p class="text-zinc-400 text-center">Loading messages...</p>
  </div>

  <!-- Reply Section -->
  <h2 class="text-xl font-semibold text-emerald-400 mt-6 mb-3">Reply / Update Status</h2>
  <div class="p-4 bg-zinc-800 rounded-2xl mb-6">
    <p class="mb-2 text-zinc-400">Click a message above to auto-fill the reply form.</p>
    <input id="replyMessageId" type="text" placeholder="Message ID" readonly
      class="w-full p-3 rounded-xl bg-zinc-700 border border-zinc-600 mb-3" />
    <textarea id="replyText" placeholder="Type your reply..." rows="3"
      class="w-full p-3 rounded-xl bg-zinc-700 border border-zinc-600 mb-3"></textarea>
    <select id="statusSelect" class="w-full p-3 rounded-xl bg-zinc-700 border border-zinc-600 mb-3">
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
    <button id="sendReplyBtn" class="w-full bg-emerald-400 text-black font-bold p-3 rounded-xl">
      Send Reply / Update Status
    </button>
  </div>

  <!-- Send Personal Message -->
  <h2 class="text-xl font-semibold text-emerald-400 mb-3">Send Personal Message</h2>
  <div class="p-4 bg-zinc-800 rounded-2xl">
    <input id="personalUid" type="text" placeholder="User UID"
      class="w-full p-3 rounded-xl bg-zinc-700 border border-zinc-600 mb-3" />
    <input id="personalTitle" type="text" placeholder="Message Title"
      class="w-full p-3 rounded-xl bg-zinc-700 border border-zinc-600 mb-3" />
    <textarea id="personalMessage" placeholder="Type your message..." rows="3"
      class="w-full p-3 rounded-xl bg-zinc-700 border border-zinc-600 mb-3"></textarea>
    <button id="sendPersonalBtn" class="w-full bg-emerald-400 text-black font-bold p-3 rounded-xl">
      Send Personal Message
    </button>
  </div>

</div>

<script type="module" src="support-admin.js"></script>
</body>
</html>
