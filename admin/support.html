<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Support Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Admin Support Panel</h1>

<div class="mb-4">
  <input id="userIdInput" type="text" placeholder="Enter User UID"
  class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2" />
  <button id="loadMessagesBtn" class="bg-emerald-400 text-black font-bold p-3 rounded-xl w-full">Load Messages</button>
</div>

<div id="supportMessagesContainer" class="space-y-4">
  <p class="text-zinc-400">Enter a UID and click Load Messages</p>
</div>

<script type="module" src="support.js"></script>
</body>
</html>
