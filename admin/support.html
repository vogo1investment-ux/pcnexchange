<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Support Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-900 text-white min-h-screen p-5">
<h1 class="text-3xl font-bold text-green-400 mb-6">Admin Support Panel</h1>

<!-- Send New Message -->
<div class="mb-6 p-4 bg-green-800 rounded-xl">
  <h2 class="text-xl font-bold mb-2">Send Message to User</h2>
  <input id="personalUid" placeholder="User UID" class="w-full p-3 mb-2 rounded-xl bg-green-700 border border-green-600"/>
  <input id="personalTitle" placeholder="Message Title" class="w-full p-3 mb-2 rounded-xl bg-green-700 border border-green-600"/>
  <textarea id="personalMessage" placeholder="Message" class="w-full p-3 mb-2 rounded-xl bg-green-700 border border-green-600"></textarea>
  <button id="sendPersonalBtn" class="bg-green-400 text-black p-3 rounded-xl w-full font-bold">Send Message</button>
</div>

<!-- Messages Container -->
<h2 class="text-xl font-bold mb-2">All User Messages</h2>
<div id="messagesContainer" class="space-y-4"></div>

<script type="module" src="support.js"></script>
</body>
</html>
