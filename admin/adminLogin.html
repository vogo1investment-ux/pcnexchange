<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black text-white flex items-center justify-center min-h-screen">

<div class="bg-zinc-900 p-8 rounded-2xl w-96">

<h1 class="text-2xl font-bold text-emerald-400 mb-6">ADMIN LOGIN</h1>

<input id="email" type="email" placeholder="Admin Email"
class="w-full p-3 mb-4 bg-black border border-zinc-700 rounded">

<input id="password" type="password" placeholder="Password"
class="w-full p-3 mb-4 bg-black border border-zinc-700 rounded">

<button id="loginBtn"
class="w-full bg-emerald-400 text-black font-bold p-3 rounded">
LOGIN
</button>

</div>

<script type="module" src="adminLogin.js"></script>

</body>
</html>
