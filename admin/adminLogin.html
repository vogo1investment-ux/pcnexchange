<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex items-center justify-center min-h-screen">

<div class="bg-zinc-900 p-8 rounded-2xl w-full max-w-md border border-zinc-800">

<h1 class="text-2xl font-bold text-emerald-400 mb-6">Admin Login</h1>

<input id="email" type="email" placeholder="Admin Email"
class="w-full p-4 mb-4 rounded-xl bg-black border border-zinc-700">

<input id="password" type="password" placeholder="Password"
class="w-full p-4 mb-6 rounded-xl bg-black border border-zinc-700">

<button id="loginBtn"
class="w-full bg-emerald-400 text-black font-bold p-4 rounded-xl">

Login

</button>

</div>

<script type="module" src="adminLogin.js"></script>

</body>
</html>
