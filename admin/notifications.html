<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Send Notification</h1>

<div class="mb-4">
<label>User ID (leave blank for all users):</label>
<input type="text" id="userIdInput" class="w-full p-2 rounded bg-zinc-900 border border-zinc-700">
</div>

<div class="mb-4">
<label>Title:</label>
<input type="text" id="titleInput" class="w-full p-2 rounded bg-zinc-900 border border-zinc-700">
</div>

<div class="mb-4">
<label>Message:</label>
<textarea id="messageInput" class="w-full p-2 rounded bg-zinc-900 border border-zinc-700"></textarea>
</div>

<div class="mb-4">
<label>Image (optional):</label>
<input type="file" id="imageInput" class="w-full p-2 rounded bg-zinc-900 border border-zinc-700">
</div>

<button id="sendBtn" class="bg-emerald-400 text-black font-bold p-3 rounded w-full">Send Notification</button>

<script type="module" src="notification.js"></script>
</body>
</html>
