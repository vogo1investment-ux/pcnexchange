<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Notification</title>

<style>
body{
  font-family: Arial;
  background:#050505;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:400px;
}

h2{
  text-align:center;
  color:#00ff88;
}

select,input,textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #333;
  background:black;
  color:white;
}

textarea{
  height:120px;
  resize:none;
}

button{
  width:100%;
  padding:12px;
  background:#00ff88;
  border:none;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  opacity:0.8;
}

#status{
  text-align:center;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="box">

<h2>Send Notification</h2>

<select id="mode">
  <option value="">Select Mode</option>
  <option value="all">Send To Everyone</option>
  <option value="uid">Send To Specific User</option>
</select>

<input type="text" id="uid" placeholder="Enter User UID" style="display:none;">

<textarea id="message" placeholder="Enter Message"></textarea>

<button id="sendBtn">Send Notification</button>

<p id="status"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const mode = document.getElementById("mode");
const uid = document.getElementById("uid");
const btn = document.getElementById("sendBtn");
const status = document.getElementById("status");

mode.addEventListener("change", () => {
  uid.style.display = mode.value === "uid" ? "block" : "none";
});

btn.addEventListener("click", async () => {

  const message = document.getElementById("message").value.trim();

  if(!mode.value){
    status.innerText = "Select mode";
    status.style.color = "red";
    return;
  }

  if(!message){
    status.innerText = "Enter message";
    status.style.color = "red";
    return;
  }

  if(mode.value === "uid" && !uid.value.trim()){
    status.innerText = "Enter User UID";
    status.style.color = "red";
    return;
  }

  try {

    await addDoc(collection(db,"notifications"),{
      type: mode.value,
      message,
      uid: mode.value === "uid" ? uid.value.trim() : null,
      createdAt: serverTimestamp()
    });

    status.innerText = "Notification Sent Successfully";
    status.style.color = "#00ff88";

    document.getElementById("message").value = "";
    uid.value = "";

  } catch(err){
    status.innerText = err.message;
    status.style.color = "red";
  }

});

</script>

</body>
</html>
