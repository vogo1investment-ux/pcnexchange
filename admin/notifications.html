<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Notification Panel</title>
<style>
body { background:#000; color:#fff; font-family:sans-serif; padding:20px; }
.container { max-width:600px; margin:auto; background:#111; padding:20px; border-radius:12px; border:1px solid #222; }
h1 { color:#0f0; text-align:center; }
input, textarea, button { width:100%; margin-bottom:10px; padding:10px; border-radius:6px; border:none; }
button { background:#0f0; color:#000; font-weight:bold; cursor:pointer; }
button:hover { background:#0c0; }
</style>
</head>
<body>
<div class="container">
<h1>Admin Notification Panel</h1>
<input type="text" id="userId" placeholder="User ID or type 'all' for broadcast" />
<input type="text" id="title" placeholder="Notification Title" />
<textarea id="message" placeholder="Notification Message"></textarea>
<button id="sendBtn">Send Notification</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
  authDomain:"pcnexchange.firebaseapp.com",
  databaseURL:"https://pcnexchange-default-rtdb.firebaseio.com",
  projectId:"pcnexchange",
  storageBucket:"pcnexchange.appspot.com",
  messagingSenderId:"278761036604",
  appId:"1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const ADMIN_UID = "XphWRwjVK6NWEtHw9XeoNxXsfT12";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Replace with your admin email/password
const ADMIN_EMAIL = "youradmin@example.com";
const ADMIN_PASSWORD = "yourAdminPassword";

signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASSWORD)
  .then(userCredential => {
    const user = userCredential.user;
    if(user.uid !== ADMIN_UID){
      alert("This is not the correct admin account!");
      return;
    }

    const sendBtn = document.getElementById("sendBtn");
    sendBtn.addEventListener("click", async () => {
      const userId = document.getElementById("userId").value.trim() || "all";
      const title = document.getElementById("title").value.trim();
      const message = document.getElementById("message").value.trim();

      if(!title || !message){
        alert("Title and message are required.");
        return;
      }

      try {
        await addDoc(collection(db,"notifications"),{
          title,
          message,
          userId,
          createdAt: serverTimestamp()
        });
        alert("Notification sent!");
        document.getElementById("userId").value="";
        document.getElementById("title").value="";
        document.getElementById("message").value="";
      } catch(err) {
        console.error(err);
        alert("Failed to send notification.");
      }
    });
  })
  .catch(err => {
    console.error(err);
    alert("Admin login failed: " + err.message);
  });
</script>
</body>
</html>
