<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-4">Send Notification</h1>

<div class="space-y-4 max-w-lg">
  <input id="userIdInput" type="text" placeholder="UserID or leave blank for all" class="w-full p-3 rounded bg-zinc-900 border border-green-500">
  <input id="titleInput" type="text" placeholder="Notification Title" class="w-full p-3 rounded bg-zinc-900 border border-green-500">
  <textarea id="messageInput" placeholder="Message" class="w-full p-3 rounded bg-zinc-900 border border-green-500"></textarea>
  <input type="file" id="imageInput" class="w-full p-2 rounded bg-zinc-900 border border-green-500">
  <button id="sendBtn" class="w-full p-3 bg-emerald-400 font-bold text-black rounded">Send Notification</button>
</div>

<script type="module" src="notification.js"></script>
</body>
</html>
