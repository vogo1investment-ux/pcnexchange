<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Notifications</title>
  <link rel="stylesheet" href="notification.css">
  <script type="module" src="notification.js" defer></script>
</head>
<body>
  <div class="notifications-container">
    <h1>Send Notification</h1>
    <input type="text" id="userId" placeholder="User UID (leave empty = everyone)">
    <textarea id="message" placeholder="Enter your notification message"></textarea>
    <button id="sendBtn">Send Notification</button>
    <div id="status"></div>
  </div>
</body>
</html>
