<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Notifications</title>
<link rel="stylesheet" href="notification.css">
</head>
<body>
  <div class="container">
    <h1>Send Notification</h1>
    <input type="text" id="userId" placeholder="User UID (leave empty = everyone)">
    <textarea id="message" placeholder="Type your notification here..."></textarea>
    <button id="sendBtn">Send Notification</button>
    <p id="status"></p>
  </div>

<script type="module" src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js"></script>
<script type="module" src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js"></script>
<script type="module" src="notification.js"></script>
