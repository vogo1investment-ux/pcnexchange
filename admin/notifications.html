<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN Admin Notifications</title>

<style>

body{
background:#050505;
color:white;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#111;
padding:25px;
border-radius:20px;
border:1px solid #222;
}

h1{
text-align:center;
color:#00ff88;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:15px;
margin-bottom:15px;
background:#000;
color:white;
border:1px solid #333;
border-radius:10px;
box-sizing:border-box;
font-size:15px;
}

textarea{
height:180px;
resize:none;
}

button{
width:100%;
padding:15px;
background:#00ff88;
color:black;
font-weight:bold;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>PCN Notification Center</h1>

<input
type="text"
id="userId"
placeholder="User UID (Leave Empty = Send To Everyone)"
>

<input
type="text"
id="title"
placeholder="Notification Title"
>

<textarea
id="message"
placeholder="Write your notification message here..."
></textarea>

<button id="sendBtn">
Send Notification
</button>

<div id="status"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
authDomain: "pcnexchange.firebaseapp.com",
databaseURL: "https://pcnexchange-default-rtdb.firebaseio.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document
.getElementById("sendBtn")
.addEventListener("click", async()=>{

const userId =
document.getElementById("userId").value.trim();

const title =
document.getElementById("title").value.trim();

const message =
document.getElementById("message").value.trim();

const status =
document.getElementById("status");

if(!title || !message){

status.style.color="red";
status.innerText="Please enter title and message.";

return;

}

status.style.color="white";
status.innerText="Sending...";

try{

await addDoc(
collection(db,"notifications"),
{
title:title,
message:message,

target:
userId
? "user"
: "all",

userId:
userId || null,

createdAt:
serverTimestamp()
}
);

status.style.color="#00ff88";
status.innerText="Notification Sent Successfully";

document.getElementById("userId").value="";
document.getElementById("title").value="";
document.getElementById("message").value="";

}
catch(error){

console.error(error);

status.style.color="red";
status.innerText=error.message;

}

});

</script>

</body>
</html>
