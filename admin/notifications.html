<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #000; color: #0f0; font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <h1 class="text-2xl font-bold mb-4">Send Notification</h1>
  <input type="text" id="userIdInput" placeholder="User ID (leave blank for all)" class="p-2 w-full mb-2 rounded bg-black border border-green-500">
  <input type="text" id="titleInput" placeholder="Title" class="p-2 w-full mb-2 rounded bg-black border border-green-500">
  <textarea id="messageInput" placeholder="Message" class="p-2 w-full mb-2 rounded bg-black border border-green-500"></textarea>
  <input type="file" id="imageInput" class="mb-2">
  <button id="sendBtn" class="p-2 rounded bg-green-500 font-bold">Send Notification</button>

  <script type="module" src="notification.js"></script>
</body>
</html>
