<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notifications</title>
<link rel="stylesheet" href="your-styles.css">
</head>
<body>
<div class="container">
<h1>Send Notification</h1>

<div>
  <input type="text" id="userId" placeholder="User UID (leave empty = all users)">
  <input type="text" id="title" placeholder="Notification Title">
  <textarea id="message" placeholder="Notification Message"></textarea>
  <button id="sendBtn">Send Notification</button>
</div>

<div id="log"></div>
</div>

<script type="module" src="notification.js"></script>
</body>
</html>
