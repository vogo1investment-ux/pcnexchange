<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Airdrop Admin</title>
<link rel="stylesheet" href="airdrop.css">
</head>

<body>

<div class="admin">

<h1>⚙️ AIRDROP ADMIN PANEL</h1>

<!-- CREATE AIRDROP -->
<div class="box">

<h2>Create Airdrop</h2>

<input id="name" placeholder="Airdrop Name">
<input id="desc" placeholder="Description">
<input id="rate" placeholder="Rate (e.g 0.00000001)">
<input id="amount" placeholder="Amount">

<input id="start" type="datetime-local">
<input id="end" type="datetime-local">

<button id="create">CREATE AIRDROP</button>

</div>

<!-- CONTROL -->
<div class="box">

<h2>Airdrop Control</h2>

<button id="load">LOAD AIRDROPS</button>

<div id="list"></div>

</div>

<!-- USERS -->
<div class="box">

<h2>Users Mining</h2>
<div id="users"></div>

</div>

<!-- WITHDRAWALS -->
<div class="box">

<h2>Withdrawals</h2>
<div id="withdrawals"></div>

</div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
