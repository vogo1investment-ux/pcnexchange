<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Airdrop Admin Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.create{background:#facc15;}
.load{background:#3b82f6;color:white;}
.green{background:#22c55e;color:white;}
.red{background:#ef4444;color:white;}
.section-title{margin:15px 0 5px;}
.item{
  background:#0b1220;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>⚙️ AIRDROP ADMIN PANEL</h2>

<!-- CREATE -->
<div class="card">
<h3>Create Airdrop</h3>

<input id="name" placeholder="Airdrop Name">
<input id="desc" placeholder="Description">
<input id="rate" placeholder="Rate">
<input id="amount" placeholder="Amount">
<input id="start" type="datetime-local">
<input id="end" type="datetime-local">

<button id="createBtn" class="create">CREATE AIRDROP</button>
</div>

<!-- AIRDROPS -->
<div class="card">
<h3 class="section-title">Airdrops</h3>
<button id="loadBtn" class="load">LOAD AIRDROPS</button>
<div id="airdropList"></div>
</div>

<!-- USERS -->
<div class="card">
<h3 class="section-title">Users</h3>
<div id="userList"></div>
</div>

<!-- WITHDRAWALS -->
<div class="card">
<h3 class="section-title">Withdrawals</h3>
<button id="loadWithdrawBtn" class="load">LOAD WITHDRAWALS</button>
<div id="withdrawList"></div>
</div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
