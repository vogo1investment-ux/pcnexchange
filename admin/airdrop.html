<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Airdrop Admin Fixed</title>

<style>
body{
  background:#0b1220;
  color:white;
  font-family:Arial;
  padding:10px;
}

.box{
  background:#111a2e;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

input, button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:none;
}

button{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.smallbtn{
  background:#3b82f6;
  color:white;
}

.red{ background:red; color:white; }
.green{ background:green; color:white; }
</style>
</head>

<body>

<h2>⚙️ ADMIN AIRDROP PANEL</h2>

<div class="box">
<h3>Create Airdrop</h3>

<input id="name" placeholder="Name">
<input id="desc" placeholder="Description">
<input id="rate" placeholder="Rate (0.00000001)">
<input id="amount" placeholder="Amount">
<input id="start" type="datetime-local">
<input id="end" type="datetime-local">

<button id="createBtn">CREATE AIRDROP</button>
</div>

<div class="box">
<h3>Airdrops</h3>
<button id="loadBtn" class="smallbtn">LOAD AIRDROPS</button>
<div id="list"></div>
</div>

<div class="box">
<h3>Users</h3>
<div id="users"></div>
</div>

<div class="box">
<h3>Withdrawals</h3>
<div id="withdrawals"></div>
</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
