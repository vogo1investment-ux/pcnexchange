<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Airdrop Admin Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

h2 {
  color: gold;
}

.card {
  background: #111a2e;
  padding: 15px;
  margin-top: 12px;
  border-radius: 12px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.create { background: gold; }
.start { background: #22c55e; }
.stop { background: #ef4444; }
.fetch { background: #3b82f6; }

.box {
  margin-top: 10px;
  padding: 10px;
  background: #0f172a;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🚀 ADMIN AIRDROP CONTROL</h2>

<!-- CREATE AIRDROP -->
<div class="card">
<h3>➕ Create Airdrop</h3>

<input id="name" placeholder="Name">
<input id="rate" placeholder="Rate per tick (0.00000001)">
<input id="start" type="datetime-local">
<input id="end" type="datetime-local">

<button class="create" onclick="createAirdrop()">Create</button>
</div>

<!-- AIRDROP LIST -->
<div class="card">
<h3>📡 Airdrops</h3>
<button class="fetch" onclick="loadAirdrops()">Load Airdrops</button>
<div id="airdropList"></div>
</div>

<!-- WITHDRAWALS -->
<div class="card">
<h3>💸 Withdrawals</h3>
<button class="fetch" onclick="fetchWithdrawals()">Fetch Withdrawals</button>
<div id="withdrawals"></div>
</div>

</div>

<script type="module" src="airdrops.js"></script>

</body>
</html>
