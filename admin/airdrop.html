<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Airdrop Admin Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  cursor:pointer;
}

.primary{background:gold;}
.blue{background:#3b82f6;color:white;}
.red{background:#ef4444;color:white;}

.item{
  background:#0b1220;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>⚙️ ADMIN AIRDROP PANEL</h2>

<div class="card">
<h3>Create Airdrop</h3>

<input id="name" placeholder="Name">
<input id="desc" placeholder="Desc">
<input id="rate" placeholder="Rate">
<input id="amount" placeholder="Amount">
<input id="start" type="datetime-local">
<input id="end" type="datetime-local">

<button id="createBtn" class="primary">CREATE AIRDROP</button>
</div>

<div class="card">
<h3>Airdrops</h3>
<button id="loadBtn" class="blue">LOAD AIRDROPS</button>
<div id="airdropList"></div>
</div>

<div class="card">
<h3>Users</h3>
<div id="userList"></div>
</div>

<div class="card">
<h3>Withdrawals</h3>
<button id="loadWithdrawBtn" class="red">LOAD WITHDRAWALS</button>
<div id="withdrawList"></div>
</div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
