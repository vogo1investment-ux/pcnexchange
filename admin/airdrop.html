<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airdrop Admin Panel</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

.container { max-width:1100px; margin:auto; padding:15px; }

.card {
  background:#111a2e;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
}

input, button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:8px;
}

button {
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.row {
  display:flex;
  justify-content:space-between;
  font-size:13px;
}
.small { font-size:12px; opacity:0.8; }
</style>
</head>

<body>

<div class="container">

<h2>🚀 Airdrop Admin Panel</h2>

<!-- CREATE AIRDROP -->
<div class="card">
<h3>➕ Create Airdrop</h3>

<input id="name" placeholder="Airdrop Name">
<input id="rate" placeholder="Mining Rate (0.00000001/sec)">
<input id="price" placeholder="Coin Price 💰">

<input id="start" type="datetime-local">
<input id="end" type="datetime-local">

<button onclick="createAirdrop()">Create Airdrop</button>
</div>

<!-- AIRDROPS -->
<div class="card">
<h3>📅 Active Airdrops</h3>
<div id="airdrops"></div>
</div>

<!-- MINERS -->
<div class="card">
<h3>⛏ Users Mining</h3>
<div id="miners"></div>
</div>

<!-- WITHDRAWALS -->
<div class="card">
<h3>💸 Withdrawals</h3>
<button onclick="fetchWithdrawals()">📥 Fetch Withdrawals</button>
<div id="withdrawals"></div>
</div>

</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
