<!DOCTYPE html>
<html>
<head>
  <title>Airdrop Admin</title>
</head>

<body>

<h2>⚙️ AIRDROP ADMIN</h2>

<div>
  <h3>Create Airdrop</h3>

  <input id="name" placeholder="Name">
  <input id="desc" placeholder="Description">
  <input id="rate" placeholder="Rate">
  <input id="amount" placeholder="Amount">

  <input id="start" type="datetime-local">
  <input id="end" type="datetime-local">

  <button id="createBtn">CREATE AIRDROP</button>
</div>

<hr>

<div>
  <h3>Airdrops</h3>
  <button id="loadBtn">LOAD AIRDROPS</button>
  <div id="list"></div>
</div>

<hr>

<div>
  <h3>Users</h3>
  <div id="users"></div>
</div>

<hr>

<div>
  <h3>Withdrawals</h3>
  <button id="loadWithdrawBtn">LOAD WITHDRAWALS</button>
  <div id="withdrawals"></div>
</div>

<script type="module" src="airdrop.js"></script>

</body>
</html>
