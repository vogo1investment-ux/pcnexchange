<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KYC Verification</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white p-5">

<h1 class="text-2xl text-emerald-400 mb-5">Complete KYC</h1>

class="w-full p-3 mb-3 bg-zinc-900">

Submit KYC

</button>

<script type="module" src="kyc.js"></script>

</body>
</html>
