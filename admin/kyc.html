<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KYC Admin Panel</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 10px;
}

h1 {
  text-align: center;
  color: #22c55e;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

img {
  width: 100%;
  max-width: 250px;
  border-radius: 10px;
  margin-top: 10px;
}

select, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

.badge {
  padding: 5px 10px;
  border-radius: 6px;
  display: inline-block;
  margin-top: 5px;
}

.pending { background: orange; }
.approved { background: green; }
.rejected { background: red; }
</style>

</head>

<body>

<h1>🛡️ KYC ADMIN PANEL</h1>

<div id="kycContainer">Loading KYC submissions...</div>

<script type="module" src="kyc.js"></script>

</body>
</html>
