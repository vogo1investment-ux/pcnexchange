<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KYC Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#22c55e;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.row{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.col{
flex:1;
min-width:150px;
}

img{
width:120px;
height:120px;
border-radius:10px;
object-fit:cover;
border:2px solid #22c55e;
}

select, button{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
}

button{
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}

button.reject{
background:#ef4444;
}

.small{
font-size:13px;
opacity:0.8;
}

.status{
font-weight:bold;
margin-top:5px;
}
</style>

</head>

<body>

<div class="container">

<h1>🛡️ KYC ADMIN PANEL</h1>

<div id="kycList">Loading submissions...</div>

</div>

<script type="module" src="kyc.js"></script>

</body>
</html>
