<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Wallets Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Users Wallets</h1>

<input id="searchInput" type="text" placeholder="Search by UID or Name"
class="w-full p-3 mb-4 rounded-2xl bg-black border border-zinc-700">

<div class="overflow-x-auto">
<table class="w-full table-auto border border-zinc-700 rounded-xl">
<thead class="bg-zinc-900">
<tr>
<th class="p-2 border-b border-zinc-700">UID</th>
<th class="p-2 border-b border-zinc-700">Name</th>
<th class="p-2 border-b border-zinc-700">Coins</th>
<th class="p-2 border-b border-zinc-700">Actions</th>
</tr>
</thead>
<tbody id="walletsTableBody" class="bg-zinc-800">
<!-- Wallets will populate here -->
</tbody>
</table>
</div>

<script type="module" src="wallets.js"></script>
</body>
</html>
