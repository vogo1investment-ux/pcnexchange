<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Wallets</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-6">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Users Wallets</h1>

<input id="searchInput" type="text" placeholder="Search by UID or Name" class="w-full mb-4 p-3 rounded-xl bg-zinc-800 text-white">

<table class="w-full text-left border border-zinc-700">
  <thead class="bg-zinc-900">
    <tr>
      <th class="p-2 border-b border-zinc-700">UID</th>
      <th class="p-2 border-b border-zinc-700">Name</th>
      <th class="p-2 border-b border-zinc-700">Coin</th>
      <th class="p-2 border-b border-zinc-700">Amount</th>
      <th class="p-2 border-b border-zinc-700">Action</th>
    </tr>
  </thead>
  <tbody id="usersTableBody">
    <!-- Dynamic users + coins rows will appear here -->
  </tbody>
</table>

<script type="module" src="wallets.js"></script>
</body>
</html>
