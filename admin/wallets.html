<!DOCTYPE html>
<html>
<head>
  <title>Admin User History</title>
  <style>
    body {
      background:#0b0f14;
      color:white;
      font-family: Arial;
      display:flex;
    }

    .left {
      width:30%;
      border-right:1px solid #222;
      height:100vh;
      overflow:auto;
      padding:10px;
    }

    .right {
      width:70%;
      padding:15px;
    }

    .user {
      padding:10px;
      background:#111;
      margin-bottom:8px;
      cursor:pointer;
      border-radius:8px;
    }

    .user:hover {
      background:#1a1a1a;
    }

    .box {
      background:#111;
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
    }

    input, select {
      width:100%;
      padding:10px;
      margin:5px 0;
      background:#000;
      color:white;
      border:1px solid #333;
      border-radius:8px;
    }

    button {
      padding:10px;
      background:limegreen;
      border:none;
      width:100%;
      cursor:pointer;
      margin-top:10px;
      border-radius:8px;
      font-weight:bold;
    }

    .txn {
      padding:10px;
      background:#0f1720;
      margin-top:8px;
      border-radius:8px;
    }

    .title {
      color:lime;
      font-size:20px;
      margin-bottom:10px;
    }
  </style>
</head>
<body>

<div class="left">
  <h3>Users</h3>
  <div id="userList"></div>
</div>

<div class="right">
  <div class="title">User History Editor</div>

  <div class="box">
    <input id="uid" placeholder="Selected User UID" disabled />

    <select id="type">
      <option value="deposit">Deposit</option>
      <option value="withdraw">Withdraw</option>
      <option value="stake">Stake</option>
      <option value="transfer">Transfer</option>
      <option value="received">Received</option>
    </select>

    <input id="amount" placeholder="Amount" />
    <input id="method" placeholder="Method (bank, crypto etc)" />
    <input id="status" placeholder="Status (pending/approved)" />

    <button id="addTxn">Add History</button>
  </div>

  <div id="historyBox"></div>
</div>

<script type="module" src="wallets.js"></script>

</body>
</html>
