<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Wallets</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5 min-h-screen">

<h1 class="text-2xl font-bold text-emerald-400 mb-4">Users Wallets</h1>

<input type="text" id="searchInput" placeholder="Search by UID or Name"
class="w-full p-2 mb-4 rounded bg-zinc-800 text-white">

<table class="min-w-full border border-zinc-700">
  <thead>
    <tr class="bg-zinc-900">
      <th class="border p-2">UID</th>
      <th class="border p-2">Name</th>
      <th class="border p-2">Coins</th>
      <th class="border p-2">Actions</th>
    </tr>
  </thead>
  <tbody id="usersTableBody"></tbody>
</table>

<script type="module" src="admin-wallets.js"></script>
</body>
</html>
