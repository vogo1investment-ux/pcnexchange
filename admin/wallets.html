<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallets Admin Panel</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f0c;
  color:white;
}

h1 {
  text-align:center;
  color:#00ff88;
  padding:15px;
}

.container {
  padding:15px;
}

.card {
  background:#121a14;
  border:1px solid #1f2b22;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}

input, select {
  width:100%;
  margin-top:5px;
  padding:8px;
  border:none;
  border-radius:6px;
  background:#1c2520;
  color:white;
}

button {
  margin-top:8px;
  width:100%;
  padding:10px;
  background:#00ff88;
  border:none;
  font-weight:bold;
  cursor:pointer;
  border-radius:6px;
}

.small {
  font-size:12px;
  opacity:0.7;
}

.badge {
  background:#00ff88;
  color:black;
  padding:3px 8px;
  border-radius:5px;
  font-size:12px;
}
</style>
</head>

<body>

<h1>Wallets Admin History</h1>

<div class="container">
  <div id="list"></div>
</div>

<script type="module" src="wallets.js"></script>
</body>
</html>
