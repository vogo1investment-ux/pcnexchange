<div class="p-4">
  <h2 class="text-emerald-400 font-bold mb-4">Send Notification</h2>
  <input id="titleInput" placeholder="Notification Title" class="p-2 mb-2 w-full rounded bg-black text-white border border-green-500">
  <textarea id="messageInput" placeholder="Message" class="p-2 mb-2 w-full rounded bg-black text-white border border-green-500"></textarea>
  <input type="file" id="imageInput" class="mb-2">
  <input id="userIdInput" placeholder="User ID (leave empty for all)" class="p-2 mb-2 w-full rounded bg-black text-white border border-green-500">
  <button id="sendBtn" class="bg-emerald-500 p-2 rounded font-bold">Send Notification</button>
</div>
