<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Requests Admin</title>
    <link rel="stylesheet" href="trades.css">
</head>
<body>
    <div class="container">
        <h1>🛠️ Admin Panel - Coin Management</h1>

        <div id="authStatus" class="status"></div>

        <h2>Pending Coin Purchase Requests</h2>
        <button id="loadRequestsBtn">Fetch Pending Requests</button>
        <div id="requestsContainer" class="requests-container"></div>

        <hr>

        <h2>Manual Coin Credit</h2>
        <div class="manual-credit">
            <select id="userSelect">
                <option value="">Select User</option>
            </select>

            <select id="coinSelect">
                <option value="">Select Coin</option>
            </select>

            <input id="coinAmount" type="number" step="0.00000001" placeholder="Amount">
            
            <button id="addCoinBtn">Add / Credit Coins</button>
        </div>

        <div id="message"></div>
    </div>

    <script type="module" src="trades.js"></script>
</body>
</html>
