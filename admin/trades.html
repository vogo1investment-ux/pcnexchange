<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User History</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">User Transaction History</h1>

<div class="mb-4">
  <input id="userIdInput" type="text" placeholder="Enter User UID" 
  class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2" />
  <button id="loadHistoryBtn" class="bg-emerald-400 text-black font-bold p-3 rounded-xl w-full">Load History</button>
</div>

<div id="historyContent" class="overflow-x-auto">
  <table class="w-full text-left border-collapse">
    <thead>
      <tr class="bg-zinc-800">
        <th class="p-2 border border-zinc-700">Type</th>
        <th class="p-2 border border-zinc-700">Amount</th>
        <th class="p-2 border border-zinc-700">Method</th>
        <th class="p-2 border border-zinc-700">Status</th>
        <th class="p-2 border border-zinc-700">Timestamp</th>
      </tr>
    </thead>
    <tbody id="historyTableBody">
      <tr><td colspan="5" class="p-4 text-center">Enter UID and click Load History</td></tr>
    </tbody>
  </table>
</div>

<script type="module" src="history.js"></script>
</body>
</html>
