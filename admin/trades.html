<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin User History</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-5">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Admin - User History</h1>

<!-- Enter User UID -->
<div class="mb-6">
  <input id="userIdInput" type="text" placeholder="Enter User UID" 
  class="w-full p-3 rounded-xl bg-zinc-900 border border-zinc-700 mb-2" />
  <button id="loadHistoryBtn" class="bg-emerald-400 text-black font-bold p-3 rounded-xl w-full">Load User History</button>
</div>

<!-- Add New History Entry -->
<div class="mb-6 bg-zinc-900 p-4 rounded-xl border border-zinc-700">
  <h2 class="text-xl font-bold text-emerald-400 mb-3">Add History Entry</h2>
  <select id="typeInput" class="w-full p-2 rounded-xl bg-black border border-zinc-700 mb-2">
    <option value="Deposit">Deposit</option>
    <option value="Withdrawal">Withdrawal</option>
    <option value="Stake">Stake</option>
    <option value="Transfer">Transfer</option>
    <option value="Received">Received</option>
  </select>
  <input id="amountInput" type="number" placeholder="Amount" class="w-full p-2 rounded-xl bg-black border border-zinc-700 mb-2">
  <input id="methodInput" type="text" placeholder="Method" class="w-full p-2 rounded-xl bg-black border border-zinc-700 mb-2">
  <select id="statusInput" class="w-full p-2 rounded-xl bg-black border border-zinc-700 mb-2">
    <option value="Approved">Approved</option>
    <option value="Rejected">Rejected</option>
    <option value="Pending">Pending</option>
  </select>
  <input id="timestampInput" type="datetime-local" class="w-full p-2 rounded-xl bg-black border border-zinc-700 mb-2">
  <button id="addEntryBtn" class="w-full bg-emerald-400 text-black font-bold p-2 rounded-xl">Add Entry</button>
</div>

<!-- History Table -->
<div class="overflow-x-auto">
  <table class="w-full text-left border-collapse">
    <thead>
      <tr class="bg-zinc-800">
        <th class="p-2 border border-zinc-700">Type</th>
        <th class="p-2 border border-zinc-700">Amount</th>
        <th class="p-2 border border-zinc-700">Method</th>
        <th class="p-2 border border-zinc-700">Status</th>
        <th class="p-2 border border-zinc-700">Timestamp</th>
        <th class="p-2 border border-zinc-700">Actions</th>
      </tr>
    </thead>
    <tbody id="historyTableBody">
      <tr><td colspan="6" class="p-4 text-center">Enter UID and click Load User History</td></tr>
    </tbody>
  </table>
</div>

<script type="module" src="trades.js"></script>
</body>
</html>
