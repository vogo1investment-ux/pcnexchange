<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Coin Requests Admin</title>
<link rel="stylesheet" href="trades.css">
</head>

<body>

<div class="container">

<h2>Pending Coin Purchases</h2>

<button id="loadRequestsBtn">
Fetch Requests
</button>

<div id="requestsContainer"></div>

<hr>

<h2>Manual Coin Credit</h2>

<select id="userSelect">
<option value="">Select User</option>
</select>

<select id="coinSelect">
<option value="">Select Coin</option>
</select>

<input
id="coinAmount"
type="number"
step="0.00000001"
placeholder="Amount">

<button id="addCoinBtn">
Add Coin
</button>

<div id="message"></div>

</div>

<script type="module" src="trades.js"></script>

</body>
</html>
