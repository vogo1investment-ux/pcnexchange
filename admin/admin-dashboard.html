<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN ADMIN DASHBOARD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="adminPanel" class="hidden">

<!-- HEADER -->
<div class="header">
<h1>PCN EXCHANGE ADMIN</h1>
<button onclick="logout()">Logout</button>
</div>

<!-- STATS GRID -->
<div class="grid">

<div class="card">
<h2>Total Users</h2>
<p id="users">0</p>
</div>

<div class="card">
<h2>Total Deposits</h2>
<p id="deposits">$0</p>
</div>

<div class="card">
<h2>Total Withdrawals</h2>
<p id="withdrawals">$0</p>
</div>

<div class="card">
<h2>Pending Requests</h2>
<p id="pending">0</p>
</div>

</div>

<!-- USER PANEL -->
<div class="panel">

<h2 style="margin-bottom:15px;">User Management</h2>

<div id="userList"></div>

</div>

</div>

<script type="module" src="admin-dashboard.js"></script>

</body>
</html>
