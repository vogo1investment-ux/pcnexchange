<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN ADMIN PANEL</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#000;
color:white;
font-family:Arial;
}

.card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:20px;
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
border-color:#00ff88;
}

.btn{
background:#00ff88;
color:black;
padding:15px;
border-radius:15px;
font-weight:bold;
}
</style>

</head>

<body>

<!-- HEADER -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:20px;background:#0a0a0a;border-bottom:1px solid #222;">
<h1 style="color:#00ff88;font-size:24px;">ADMIN DASHBOARD</h1>

<a href="../index.html" style="color:red;">Logout</a>
</div>

<!-- STATS -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;padding:20px;">

<div class="card">
<h3>Users</h3>
<p id="users">0</p>
</div>

<div class="card">
<h3>Total Deposits</h3>
<p id="deposits">$0</p>
</div>

<div class="card">
<h3>Total Withdraw</h3>
<p id="withdraw">$0</p>
</div>

<div class="card">
<h3>KYC Pending</h3>
<p id="kyc">0</p>
</div>

</div>

<!-- BUTTONS -->
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:20px;">

<a class="card" href="admin-kyc.html">🪪 KYC APPROVAL</a>

<a class="card" href="admin-support.html">💬 SUPPORT MESSAGES</a>

<a class="card" href="admin-notification.html">🔔 SEND NOTIFICATIONS</a>

<a class="card" href="admin-deposits.html">💰 DEPOSITS</a>

<a class="card" href="admin-withdraw.html">🏧 WITHDRAWALS</a>

<a class="card" href="admin-users.html">👤 USERS</a>

</div>

</body>
</html>
