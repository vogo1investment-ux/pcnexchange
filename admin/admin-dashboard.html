<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCN Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="admin-dashboard.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex">

<!-- Sidebar -->
<aside class="sidebar">
  <h2 class="text-emerald-400 font-bold text-2xl mb-6">PCN ADMIN</h2>
  <nav class="nav-buttons">
    <button class="sidebar-btn" data-section="dashboard">Dashboard</button>
    <button class="sidebar-btn" data-section="users">Users</button>
    <button class="sidebar-btn" data-section="kyc">KYC Verification</button>
    <button class="sidebar-btn" data-section="deposits">Deposits</button>
    <button class="sidebar-btn" data-section="withdrawals">Withdrawals</button>
    <button class="sidebar-btn" data-section="crypto-assets">Crypto Assets</button>
    <button class="sidebar-btn" data-section="markets">Markets</button>
    <button class="sidebar-btn" data-section="notifications">Notifications</button>
    <button class="sidebar-btn" data-section="airdrop">Airdrop</button>
    <button class="sidebar-btn text-red-500" id="logoutBtn">Logout</button>
  </nav>
</aside>

<!-- Main content -->
<main class="main-content">
  <div class="dashboard-stats" id="dashboard-section">
    <div class="stat-card">
      <p>Total Users</p>
      <h2 id="totalUsers">0</h2>
    </div>
    <div class="stat-card">
      <p>Total Deposits</p>
      <h2 id="totalDeposits">$0.00</h2>
    </div>
    <div class="stat-card">
      <p>Total Withdrawals</p>
      <h2 id="totalWithdrawals">$0.00</h2>
    </div>
  </div>

  <div id="section-content" class="section-content">
    <p class="text-gray-400 text-center py-10">Select a section from the sidebar to view details.</p>
  </div>
</main>

<script type="module" src="admin-dashboard.js"></script>
</body>
</html>
