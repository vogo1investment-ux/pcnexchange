<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Withdraw Funds

</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white min-h-screen p-5"><h1 class="text-3xl font-bold text-red-400 mb-6">Withdraw Funds

</h1><div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800"><h2 class="text-2xl font-bold mb-5 text-red-400">Withdrawal Request

</h2><input
id="amount"
type="number"
placeholder="Enter Withdrawal Amount"
class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4"

«»

<input
id="bankName"
type="text"
placeholder="Bank Name"
class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4"

«»

<input
id="accountNumber"
type="number"
placeholder="Account Number"
class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4"

«»

<input
id="accountName"
type="text"
placeholder="Account Name"
class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4"

«»

<button
id="submitWithdraw"
class="w-full bg-red-400 text-black font-bold p-4 rounded-2xl"

«»

Submit Withdrawal

</button></div><script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",

authDomain:
"pcnexchange.firebaseapp.com",

databaseURL:
"https://pcnexchange-default-rtdb.firebaseio.com",

projectId:
"pcnexchange",

storageBucket:
"pcnexchange.firebasestorage.app",

messagingSenderId:
"278761036604",

appId:
"1:278761036604:web:a02e2d2ac7a9379d6f9c39"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

let currentUser = null;

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location =
"index.html";

return;

}

currentUser = user;

});

document.getElementById(
"submitWithdraw"
).onclick = async ()=>{

const amount =
document.getElementById(
"amount"
).value;

const bankName =
document.getElementById(
"bankName"
).value;

const accountNumber =
document.getElementById(
"accountNumber"
).value;

const accountName =
document.getElementById(
"accountName"
).value;

if(
!amount ||
!bankName ||
!accountNumber ||
!accountName
){

alert(
"Fill all fields"
);

return;

}

await addDoc(

collection(db,"transactions"),

{

uid: currentUser.uid,

type: "withdraw",

amount: amount,

bankName: bankName,

accountNumber: accountNumber,

accountName: accountName,

status: "pending",

createdAt: Date.now()

}

);

alert(
"Withdrawal Request Sent Successfully"
);

window.location =
"history.html";

};

</script></body></html>
