<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFILE</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="dashboard.css"><style>
body{
background:black;
color:white;
font-family:Arial;
margin:0;
padding:0;
padding-bottom:100px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#111;
border-bottom:1px solid #222;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.icon{
width:45px;
height:45px;
background:#00ff88;
color:black;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
font-weight:bold;
font-size:22px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:30px;
padding:30px;
margin-top:25px;
}

.card input{
width:100%;
padding:18px;
background:black;
border:1px solid #333;
border-radius:20px;
color:white;
margin-top:15px;
}

.btn{
width:100%;
padding:18px;
margin-top:20px;
background:#00ff88;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:black;
}

.info{
margin-top:15px;
color:#777;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:12px;
font-size:12px;
margin-top:10px;
}

.verified{
background:#00ff88;
color:black;
}

.pending{
background:orange;
color:black;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:1px solid #222;
display:flex;
justify-content:space-around;
padding:15px 0;
}

.bottom-nav a{
display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:#777;
font-size:13px;
}

.bottom-nav .active{
color:#00ff88;
}
</style></head><body><div class="header">
<div class="logo">
<div class="icon">P</div>
<h1>PCN PROFILE</h1>
</div><a href="dashboard.html" style="color:#00ff88;">Dashboard</a>

</div><div class="container"><div class="card"><h2>Profile Information</h2><input id="username" placeholder="Username"><div class="info" id="email">Loading Email...</div>
<div class="info" id="uid">Loading UID...</div><!-- KYC STATUS --><div class="info" id="kycStatus">KYC: Loading...</div><!-- VERIFIED BADGE --><div id="verifiedBadge"></div><!-- COMPLETE KYC BUTTON --><button id="kycBtn" class="btn" style="background:#ff9800;">
Complete KYC
</button><button id="saveBtn" class="btn">
SAVE PROFILE
</button></div>
</div><div class="bottom-nav">
<a href="dashboard.html">Home</a>
<a href="markets.html">Markets</a>
<a href="trade.html">Trade</a>
<a href="profile.html" class="active">Profile</a>
</div><script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
updateDoc,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
apiKey: "AIzaSyCQVHBn504Y26YtR38JRJhRlUbBoa2CIPo",
authDomain: "pcnexchange.firebaseapp.com",
projectId: "pcnexchange",
storageBucket: "pcnexchange.firebasestorage.app",
messagingSenderId: "278761036604",
appId: "1:278761036604:web:a02e2d2ac7a9379d6f9c39"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const username = document.getElementById("username");
const email = document.getElementById("email");
const uid = document.getElementById("uid");

const kycStatus = document.getElementById("kycStatus");
const verifiedBadge = document.getElementById("verifiedBadge");
const kycBtn = document.getElementById("kycBtn");
const saveBtn = document.getElementById("saveBtn");

let currentUser = null;

/* LOAD USER */
onAuthStateChanged(auth, async (user) => {

if (!user) {
window.location = "index.html";
return;
}

currentUser = user;

email.innerText = "Email: " + user.email;
uid.innerText = "UID: " + user.uid;

/* LOAD PROFILE */
const userRef = doc(db, "users", user.uid);
const snap = await getDoc(userRef);

if (snap.exists()) {
const data = snap.data();
username.value = data.username || "";
}

/* LOAD KYC */
const kycQuery = query(
collection(db, "kyc"),
where("uid", "==", user.uid)
);

const kycSnap = await getDocs(kycQuery);

if (!kycSnap.empty) {

kycSnap.forEach(docu => {
const kyc = docu.data();

kycStatus.innerText = "KYC: " + kyc.status.toUpperCase();

if (kyc.status === "approved") {
verifiedBadge.innerHTML = "✅ VERIFIED USER";
verifiedBadge.className = "badge verified";
kycBtn.style.display = "none";
}

if (kyc.status === "pending") {
kycStatus.className = "badge pending";
}

});
} else {
kycStatus.innerText = "KYC: NOT SUBMITTED";
}

});

/* SAVE PROFILE */
saveBtn.onclick = async () => {

const userRef = doc(db, "users", currentUser.uid);

await updateDoc(userRef, {
username: username.value
});

alert("Profile Updated");
};

/* GO TO KYC PAGE */
kycBtn.onclick = () => {
window.location = "kyc.html";
};

</script></body>
</html>
