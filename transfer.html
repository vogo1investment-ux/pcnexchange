<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Funds</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-5 min-h-screen">

<h1 class="text-3xl font-bold text-emerald-400 mb-6">Send Funds</h1>

<div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-6">
<h2 class="text-2xl font-bold mb-4 text-emerald-400">Transfer Details</h2>

<input id="recipient" type="text" placeholder="Recipient Email or UID"
  class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4">

<input id="amount" type="number" placeholder="Amount to Transfer"
  class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4">

<input id="password" type="password" placeholder="Your Password"
  class="w-full p-4 rounded-2xl bg-black border border-zinc-700 mb-4">

<button id="submitTransfer" class="w-full bg-emerald-400 text-black font-bold p-4 rounded-2xl">
Send Transfer
</button>
</div>

<script type="module" src="transfer.js"></script>

</body>
</html>
