<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Funds</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white"><div class="p-5 border-b border-zinc-800"><h1 class="text-2xl font-bold text-emerald-500">
Transfer Funds
</h1></div><div class="p-5"><div class="bg-zinc-900 p-5 rounded-2xl"><label>

</label><input
